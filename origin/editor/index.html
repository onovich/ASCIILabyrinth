<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Labyrinth Level Editor</title>
    <link rel="stylesheet" href="../shared/ui-system.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: var(--al-color-bg);
        --panel: var(--al-color-surface);
        --panel-strong: var(--al-color-surface-strong);
        --line: var(--al-color-line);
        --line-soft: var(--al-color-line-soft);
        --text: var(--al-color-text);
        --muted: var(--al-color-muted);
        --accent: var(--al-color-accent);
        --warn: var(--al-color-amber);
        --danger: var(--al-color-danger);
        --blue: #6ba6f6;
        --cyan: var(--al-color-cyan);
        --cell: 32px;
        font-family: var(--al-font-ui);
      }

      html {
        width: 100%;
        height: 100%;
      }

      .al-tool-page textarea {
        min-height: 84px;
      }

      .topbar {
        grid-template-columns: minmax(180px, 260px) 1fr auto;
      }

      .level-toolbar {
        gap: 10px;
      }

      .toolbar select {
        max-width: 210px;
      }

      .toolbar button {
        min-width: 34px;
        padding: 0 10px;
      }

      .segmented {
        display: inline-grid;
        grid-auto-flow: column;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }

      .segmented button {
        border: 0;
        border-radius: 0;
        min-width: 42px;
        background: #171b20;
      }

      .segmented button.active {
        background: #31533f;
        color: #ffffff;
      }

      .floor-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        border: 1px solid rgba(97, 211, 148, 0.48);
        border-radius: 9px;
        background: #102019;
      }

      .toolbar-label {
        padding: 0 2px 0 4px;
        color: #cfeadd;
        font-size: 12px;
        font-weight: 700;
      }

      .floor-switch {
        gap: 5px;
        border: 0;
        border-radius: 0;
        overflow: visible;
      }

      .floor-switch button {
        min-width: 62px;
        min-height: 36px;
        border: 1px solid #365442;
        border-radius: 7px;
        background: #151d19;
        color: #cdd8cf;
        font-weight: 800;
      }

      .floor-switch button.active {
        border-color: var(--accent);
        background: #2f7b59;
        box-shadow: 0 0 0 2px rgba(97, 211, 148, 0.16);
        color: #ffffff;
      }

      .floor-preview-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .floor-preview-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #171b20;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .floor-preview-toggle input {
        width: 14px;
        height: 14px;
        min-height: 0;
        margin: 0;
      }

      .floor-preview-toggle:has(input:checked) {
        border-color: #668b73;
        background: #1b2922;
        color: #e8f1ea;
      }

      .floor-preview-toggle:has(input:disabled) {
        opacity: 0.48;
      }

      .workspace {
        grid-template-columns: 250px minmax(360px, 1fr) 318px;
      }

      .palette-item {
        grid-template-columns: 34px 1fr auto;
        min-height: 42px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: grab;
        user-select: none;
      }

      .palette-item.active {
        border-color: var(--accent);
        background: #1b2a22;
      }

      .palette-icon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 1px solid currentColor;
        border-radius: 5px;
        font-family: "Courier New", monospace;
        font-weight: 700;
      }

      .palette-item span {
        display: block;
        min-width: 0;
      }

      .palette-name {
        font-size: 13px;
        font-weight: 700;
      }

      .palette-code {
        color: var(--muted);
        font-size: 11px;
      }

      .canvas-shell {
        grid-template-rows: auto 1fr;
        background: #0d0f11;
      }

      .scene-strip {
        min-height: 56px;
        padding: 8px 10px;
        flex-wrap: wrap;
      }

      .scene-strip strong {
        font-weight: 700;
      }

      .scene-summary {
        display: grid;
        gap: 2px;
        min-width: 190px;
      }

      .scene-controls {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
        flex-wrap: wrap;
      }

      #cursorReadout {
        min-width: 62px;
        text-align: right;
      }

      .canvas-wrap {
        overflow: auto;
        background: #0b0d0f;
      }

      #mapCanvas {
        display: block;
        margin: 18px;
        border: 1px solid var(--line);
        background: #151812;
        image-rendering: pixelated;
        cursor: crosshair;
      }

      #mapCanvas[data-tool='select'] {
        cursor: grab;
      }

      #mapCanvas[data-tool='eraser'] {
        cursor: not-allowed;
      }

      #mapCanvas[data-dragging='move'] {
        cursor: grabbing;
      }

      .object-tooltip {
        position: fixed;
        z-index: 30;
        min-width: 180px;
        max-width: 260px;
        padding: 8px 10px;
        border: 1px solid rgba(97, 211, 148, 0.55);
        border-radius: 8px;
        background: rgba(13, 15, 17, 0.94);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
      }

      .object-tooltip strong {
        display: block;
        margin-bottom: 2px;
        color: #ffffff;
        font-size: 13px;
      }

      .object-tooltip span {
        display: block;
        color: var(--muted);
      }

      .row button {
        flex: 1;
      }

      @media (max-width: 1100px) {
        .workspace {
          grid-template-columns: 220px minmax(300px, 1fr) 280px;
        }
      }

      @media (max-width: 860px) {
        .workspace {
          grid-template-rows: 190px 1fr 280px;
        }

        .sidebar {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: 250px;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body class="al-tool-page">
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark">AL</div>
          <div>
            <strong>ASCII Labyrinth 地编</strong>
            <span id="projectMeta">Level config</span>
          </div>
        </div>

        <div class="toolbar level-toolbar">
          <select id="levelSelect" title="关卡"></select>
          <button id="addLevelBtn" title="新增关卡">+</button>
          <button id="duplicateLevelBtn" title="复制关卡">⧉</button>
          <button id="deleteLevelBtn" class="danger" title="删除关卡">×</button>
        </div>

        <div class="toolbar">
          <button id="undoBtn" title="撤销上一步 (Ctrl+Z)" disabled>撤销</button>
          <button id="saveBtn" class="primary" title="保存到本机">保存</button>
          <button id="loadBtn" title="读取本机存档">读取</button>
          <button id="exportBtn" title="导出 JSON">导出</button>
          <button id="importBtn" title="导入 JSON">导入</button>
          <input id="importFile" class="file-input" type="file" accept="application/json,.json" />
          <a href="../model-editor/index.html" class="pill">模型</a>
          <a href="../runtime/index.html" class="pill">运行</a>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar" id="palettePanel"></aside>

        <section class="canvas-shell">
          <div class="scene-strip">
            <div class="scene-summary">
              <strong id="sceneName"></strong>
              <span id="sceneStats"></span>
            </div>
            <div class="scene-controls">
              <div class="floor-controls">
                <span class="toolbar-label">楼层</span>
                <div class="segmented floor-switch" id="floorSwitch" aria-label="楼层"></div>
              </div>
              <div class="floor-preview-controls" aria-label="相邻楼层预览">
                <label class="floor-preview-toggle">
                  <input id="showPrevFloor" type="checkbox" />
                  <span id="prevFloorLabel">显示上一层</span>
                </label>
                <label class="floor-preview-toggle">
                  <input id="showNextFloor" type="checkbox" />
                  <span id="nextFloorLabel">显示下一层</span>
                </label>
              </div>
              <span id="cursorReadout">x 0 / y 0</span>
            </div>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="mapCanvas"></canvas>
            <div id="objectTooltip" class="object-tooltip" hidden></div>
          </div>
        </section>

        <aside class="inspector">
          <div class="section">
            <h2 class="section-title">关卡</h2>
            <div id="levelInspector" class="stack"></div>
          </div>
          <div class="section">
            <h2 class="section-title">选中对象</h2>
            <div id="objectInspector" class="stack"></div>
          </div>
        </aside>
      </section>

      <footer class="statusbar">
        <span id="statusText">Ready</span>
        <span id="schemaText">schema v1</span>
      </footer>
    </main>

    <script src="../shared/ui-system.js"></script>
    <script src="../shared/game-schema.js"></script>
    <script>
      const SHARED_UI = window.ASCIIUI || {};
      const SHARED_DATA = window.ASCII_LABYRINTH_DATA || {};
      const bindElements = SHARED_UI.bindElements;
      const bindClickHandlers = SHARED_UI.bindClickHandlers;
      const bindChangeHandlers = SHARED_UI.bindChangeHandlers;
      const bindDelegatedClickHandlers = SHARED_UI.bindDelegatedClickHandlers;
      const bindDelegatedChangeHandlers = SHARED_UI.bindDelegatedChangeHandlers;
      const importTextFile = SHARED_UI.importTextFile;
      const STORAGE_KEY = SHARED_DATA.STORAGE_KEYS?.editorProject || 'ascii-labyrinth-editor-v1';
      const CELL_SIZE = 32;
      const HISTORY_LIMIT = 80;
      const FLOORS = SHARED_DATA.FLOORS || [
        { id: 0, label: 'B1' },
        { id: 1, label: '1F' }
      ];

      const defaultEffect = SHARED_DATA.createDefaultEffect || ((type) => ({
        type,
        healAmount: 20,
        dialog: '无线电短句',
        targetLevelId: '',
        targetEntranceId: '',
        targetFloor: 0,
        doorId: '',
        weaponKind: 'scatter'
      }));

      const defaultInteraction = SHARED_DATA.createDefaultInteraction || ((type) => ({
        mode: 'interact',
        once: true,
        effect: defaultEffect(type)
      }));

      const TYPE_META = SHARED_DATA.createEditorTypeMeta?.() || {
        select: { group: '工具', name: '选择', icon: 'SEL', color: '#61d394', default: {} },
        wall: { group: '结构', name: '墙壁', icon: 'W', color: '#718078', default: { w: 1, h: 1, blocking: true } },
        keyDoor: { group: '结构', name: '钥匙门', icon: 'D', color: '#6ba6f6', default: { w: 1, h: 1, doorId: 'door-a', requiredKeyId: 'key-a', locked: true } },
        hiddenDoor: { group: '结构', name: '隐藏门', icon: 'H', color: '#a889dc', default: { w: 1, h: 1, doorId: 'hidden-a', requiredKeyId: 'key-a', locked: true, hidden: true } },
        ramp: { group: '结构', name: '斜坡', icon: 'R', color: '#d2a24f', default: { w: 2, h: 1, floorFrom: 0, floorTo: 1, direction: 'east' } },
        entrance: { group: '场景', name: '入口', icon: 'IN', color: '#67d68c', default: { w: 1, h: 1, entranceId: 'entry-a' } },
        exit: { group: '场景', name: '出口', icon: 'EX', color: '#50d6cf', default: { w: 1, h: 1, exitId: 'exit-a', targetLevelId: '', targetEntranceId: '' } },
        key: { group: '物品', name: '钥匙', icon: 'K', color: '#f1d36d', default: { w: 1, h: 1, keyId: 'key-a', boundDoorId: 'door-a' } },
        terminal: { group: '物品', name: '终端', icon: 'T', color: '#66d99c', default: { w: 1, h: 1, message: 'EXIT CODE :: 3142', interaction: defaultInteraction('dialog') } },
        enemy: { group: '单位', name: '敌人', icon: 'E', color: '#e06f6b', default: { w: 1, h: 1, enemyKind: 'longlimb', patrol: 'idle' } },
        npc: { group: '单位', name: 'NPC', icon: 'N', color: '#c6c0a5', default: { w: 1, h: 1, npcId: 'npc-a', interaction: defaultInteraction('dialog') } },
        ammo: { group: '补给', name: '弹药', icon: 'A', color: '#71c7ff', default: { w: 1, h: 1, amount: 15 } },
        medkit: { group: '补给', name: '医疗包', icon: '+', color: '#72d47e', default: { w: 1, h: 1, amount: 30 } },
        weapon: { group: '补给', name: '武器', icon: 'G', color: '#f08f59', default: { w: 1, h: 1, weaponKind: 'scatter', ammo: 6 } },
        trigger: { group: '逻辑', name: '触发器', icon: 'TR', color: '#e4b15b', default: { w: 3, h: 2, triggerId: 'trigger-a', once: true, effect: defaultEffect('dialog') } },
        eraser: { group: '工具', name: '橡皮', icon: '⌫', color: '#b8b8b8', default: {} }
      };

      const PALETTE_ORDER = SHARED_DATA.PALETTE_ORDER || [
        'select',
        'wall',
        'keyDoor',
        'hiddenDoor',
        'ramp',
        'entrance',
        'exit',
        'key',
        'terminal',
        'enemy',
        'npc',
        'ammo',
        'medkit',
        'weapon',
        'trigger',
        'eraser'
      ];
      const setByPath = SHARED_DATA.setValueByPath;
      const getByPath = SHARED_DATA.getValueByPath;
      const escapeHtml = SHARED_DATA.escapeHtml;
      const escapeAttr = SHARED_DATA.escapeAttr;
      const optionHtml = SHARED_DATA.optionHtml;
      const optionsHtml = SHARED_DATA.optionsHtml;
      const optionsWithEmptyHtml = SHARED_DATA.optionsWithEmptyHtml;
      const colorVarStyle = SHARED_UI.colorVarStyle;
      const swatchHtml = SHARED_UI.swatchHtml;
      const downloadTextFile = SHARED_UI.downloadTextFile;
      const parseJson = SHARED_DATA.parseJson;
      const createJsonDownloadPayload = SHARED_DATA.createJsonDownloadPayload;
      const readStorageText = SHARED_DATA.readStorageText;
      const hasStorageText = SHARED_DATA.hasStorageText;
      const saveStorageJson = SHARED_DATA.saveStorageJson;
      const toIsoTimestamp = SHARED_DATA.toIsoTimestamp;
      const touchSharedProject = SHARED_DATA.touchProject;
      const countBy = SHARED_DATA.countBy;
      const clamp = SHARED_DATA.clamp;
      const allLevelObjects = SHARED_DATA.allLevelObjects;
      const objectOnLevelFloor = SHARED_DATA.objectOnFloor;
      const getFloorLabel = SHARED_DATA.getFloorLabel;
      const hasFloor = SHARED_DATA.hasFloor;
      const getFloorIds = SHARED_DATA.getFloorIds;
      const getMaxFloorSpan = SHARED_DATA.getMaxFloorSpan;
      const getAdjacentFloorId = SHARED_DATA.getAdjacentFloorId;
      const createSharedId = SHARED_DATA.createId;

      const ENEMY_KIND_OPTIONS = SHARED_DATA.ENEMY_KIND_OPTIONS || [
        ['longlimb', '走廊瘦长人'],
        ['orderly', '无脸护理员'],
        ['inverted', '倒行爬行者'],
        ['splitjaw', '裂颌病患'],
        ['cultist', '触须信徒'],
        ['watcher', '门缝窥视者'],
        ['stitched', '缝合巨人'],
        ['priest', '深井祭司']
      ];

      const dom = bindElements([
        'levelSelect',
        'addLevelBtn',
        'duplicateLevelBtn',
        'deleteLevelBtn',
        'floorSwitch',
        'showPrevFloor',
        'showNextFloor',
        'prevFloorLabel',
        'nextFloorLabel',
        'undoBtn',
        'saveBtn',
        'loadBtn',
        'exportBtn',
        'importBtn',
        'importFile',
        'palettePanel',
        'mapCanvas',
        'canvasWrap',
        'objectTooltip',
        'levelInspector',
        'objectInspector',
        'sceneName',
        'sceneStats',
        'cursorReadout',
        'statusText',
        'projectMeta',
        'schemaText'
      ]);

      const ctx = dom.mapCanvas.getContext('2d');
      let project = createStarterProject();
      let currentLevelId = project.levels[0].id;
      let currentFloor = 0;
      let selectedId = null;
      let hoveredId = null;
      let floorPreview = { previous: false, next: false };
      let activeTool = 'select';
      let dragState = null;
      let undoStack = [];

      function createStarterProject() {
        return {
          version: 1,
          updatedAt: toIsoTimestamp(),
          settings: { cellSize: CELL_SIZE },
          levels: [
            createStarterLevel(),
            createLevel('upper-archive', '上层档案室', 24, 14, true)
          ]
        };
      }

      function createStarterLevel() {
        const level = createLevel('facility-a', '当前关卡：设施 A', 25, 17, false);
        const add = (type, x, y, floor, extra = {}) => {
          level.objects.push(createObject(type, x, y, floor, extra));
        };

        for (let x = 0; x < level.width; x++) {
          add('wall', x, 0, 0);
          add('wall', x, level.height - 1, 0);
        }
        for (let y = 1; y < level.height - 1; y++) {
          add('wall', 0, y, 0);
          add('wall', level.width - 1, y, 0);
        }
        for (let x = 4; x <= 18; x++) if (![8, 14].includes(x)) add('wall', x, 5, 0);
        for (let y = 5; y <= 13; y++) if (![8, 11].includes(y)) add('wall', 14, y, 0);
        for (let x = 14; x <= 22; x++) if (x !== 20) add('wall', x, 10, 0);

        add('entrance', 2, 2, 0, { label: '入口 A', entranceId: 'entry-a' });
        add('keyDoor', 8, 5, 0, { label: '钥匙门 A', doorId: 'door-a', requiredKeyId: 'key-a' });
        add('hiddenDoor', 20, 10, 0, { label: '隐藏门 A', doorId: 'hidden-a', requiredKeyId: 'key-a' });
        add('key', 17, 13, 0, { label: '钥匙 A', keyId: 'key-a', boundDoorId: 'door-a' });
        add('terminal', 21, 8, 0, { label: '密码终端', message: 'EXIT CODE :: 3142' });
        add('exit', 22, 14, 0, { label: '去上层', exitId: 'exit-upper', targetLevelId: 'upper-archive', targetEntranceId: 'entry-upper', targetFloor: 1 });
        add('ramp', 11, 8, 0, { label: '上层斜坡', floorFrom: 0, floorTo: 1, direction: 'east' });
        add('weapon', 6, 3, 0, { weaponKind: 'scatter' });
        add('ammo', 5, 8, 0);
        add('ammo', 16, 11, 0);
        add('medkit', 10, 12, 0);
        add('enemy', 12, 3, 0, { label: '走廊瘦长人', enemyKind: 'longlimb' });
        add('enemy', 18, 7, 0, { label: '无脸护理员', enemyKind: 'orderly' });
        add('npc', 3, 12, 0, {
          label: '幸存者',
          npcId: 'survivor-a',
          interaction: {
            mode: 'interact',
            once: false,
            effect: { ...defaultEffect('dialog'), dialog: '门后面有一台终端。' }
          }
        });
        level.triggers.push(createObject('trigger', 2, 10, 0, {
          label: '医疗触发区',
          triggerId: 'heal-zone-a',
          once: false,
          effect: { ...defaultEffect('heal'), type: 'heal', healAmount: 15 }
        }));
        level.triggers.push(createObject('trigger', 19, 13, 0, {
          label: '出口提示',
          triggerId: 'exit-dialog-a',
          once: true,
          effect: { ...defaultEffect('dialog'), dialog: '出口需要终端给出的密码。' }
        }));

        for (let x = 9; x <= 13; x++) add('wall', x, 3, 1);
        for (let y = 3; y <= 7; y++) add('wall', 13, y, 1);
        add('entrance', 11, 7, 1, { label: '上层入口', entranceId: 'entry-ramp' });
        add('ammo', 10, 4, 1);
        add('enemy', 12, 6, 1, { label: '门缝窥视者', enemyKind: 'watcher' });
        return level;
      }

      function createLevel(id, name, width = 24, height = 16, upperStart = false) {
        return SHARED_DATA.createEditorLevel(id, name, width, height, {
          upperStart,
          typeMeta: TYPE_META,
          makeId,
          floors: getFloorIds(FLOORS)
        });
      }

      function createObject(type, x, y, floor = currentFloor, extra = {}) {
        return SHARED_DATA.createEditorObject(type, x, y, floor, extra, {
          typeMeta: TYPE_META,
          makeId
        });
      }

      function makeId(prefix) {
        return createSharedId(prefix);
      }

      function getLevel() {
        return project.levels.find((level) => level.id === currentLevelId) || project.levels[0];
      }

      function getCollectionForObject(level, object) {
        return object.type === 'trigger' ? level.triggers : level.objects;
      }

      function allObjects(level = getLevel()) {
        return allLevelObjects(level);
      }

      function findObject(id) {
        return allObjects().find((object) => object.id === id) || null;
      }

      function floorLabel(floorId) {
        return getFloorLabel(floorId, FLOORS);
      }

      function adjacentFloorId(direction) {
        return getAdjacentFloorId(currentFloor, direction, FLOORS);
      }

      function floorExists(floorId) {
        return hasFloor(floorId, FLOORS);
      }

      function objectOnFloor(object, floorId = currentFloor) {
        return objectOnLevelFloor(object, floorId);
      }

      function visibleOnFloor(object) {
        return objectOnFloor(object, currentFloor);
      }

      function getPreviewFloorIds() {
        const floors = [];
        const previous = adjacentFloorId(-1);
        const next = adjacentFloorId(1);
        if (floorPreview.previous && previous !== null && floorExists(previous)) floors.push(previous);
        if (floorPreview.next && next !== null && floorExists(next)) floors.push(next);
        return floors;
      }

      function makeUndoSnapshot(label) {
        return structuredClone({
          label,
          project,
          currentLevelId,
          currentFloor,
          selectedId,
          floorPreview,
          activeTool
        });
      }

      function recordUndo(label) {
        undoStack.push(makeUndoSnapshot(label));
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        renderUndoControls();
      }

      function restoreUndoSnapshot(snapshot) {
        project = structuredClone(snapshot.project);
        project = validateProject(project);
        currentLevelId = project.levels.some((level) => level.id === snapshot.currentLevelId)
          ? snapshot.currentLevelId
          : project.levels[0].id;
        currentFloor = floorExists(snapshot.currentFloor) ? snapshot.currentFloor : project.levels[0].floors?.[0] ?? 0;
        floorPreview = {
          previous: Boolean(snapshot.floorPreview?.previous),
          next: Boolean(snapshot.floorPreview?.next)
        };
        activeTool = TYPE_META[snapshot.activeTool] ? snapshot.activeTool : 'select';
        clearSelection();
        dragState = null;
        if (snapshot.selectedId && findObject(snapshot.selectedId)) selectedId = snapshot.selectedId;
        render();
      }

      function undoLastEdit() {
        const snapshot = undoStack.pop();
        if (!snapshot) {
          setStatus('没有可撤销的编辑');
          renderUndoControls();
          return;
        }
        restoreUndoSnapshot(snapshot);
        setStatus(`已撤销：${snapshot.label || '上一步编辑'}`);
      }

      function renderUndoControls() {
        dom.undoBtn.disabled = undoStack.length === 0;
        dom.undoBtn.title = undoStack.length ? `撤销上一步 (Ctrl+Z) · ${undoStack.length}` : '没有可撤销的编辑';
      }

      function clampObject(object, level = getLevel()) {
        object.x = clamp(Number(object.x) || 0, 0, level.width - Math.max(1, object.w || 1));
        object.y = clamp(Number(object.y) || 0, 0, level.height - Math.max(1, object.h || 1));
        object.w = clamp(Number(object.w) || 1, 1, level.width);
        object.h = clamp(Number(object.h) || 1, 1, level.height);
        if (object.type !== 'ramp') {
          const floorIds = getFloorIds(FLOORS);
          const minFloor = Math.min(...floorIds);
          object.floor = floorExists(Number(object.floor)) ? Number(object.floor) : minFloor;
          if ('floorSpan' in object) {
            const maxSpan = getMaxFloorSpan(object.floor, FLOORS);
            object.floorSpan = clamp(Number(object.floorSpan) || 1, 1, maxSpan);
          }
        }
      }

      function render() {
        const level = getLevel();
        const ratio = window.devicePixelRatio || 1;
        const width = level.width * CELL_SIZE;
        const height = level.height * CELL_SIZE;
        dom.mapCanvas.style.width = `${width}px`;
        dom.mapCanvas.style.height = `${height}px`;
        dom.mapCanvas.width = Math.floor(width * ratio);
        dom.mapCanvas.height = Math.floor(height * ratio);
        dom.mapCanvas.dataset.tool = activeTool;
        dom.mapCanvas.dataset.dragging = dragState?.mode || '';
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        drawScene(level, width, height);
        renderMeta();
        renderLevelControls();
        renderInspector();
        renderPalette();
        renderUndoControls();
        document.body.dataset.editorSnapshot = JSON.stringify(getDebugSnapshot());
      }

      function drawScene(level, width, height) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = currentFloor === 0 ? '#151812' : '#17171c';
        ctx.fillRect(0, 0, width, height);
        drawGrid(level);

        const all = allObjects(level);
        for (const floorId of getPreviewFloorIds()) {
          const previewObjects = all.filter((object) => objectOnFloor(object, floorId) && !visibleOnFloor(object));
          drawObjectGroup(previewObjects, { preview: true, floorId });
        }

        drawObjectGroup(all.filter(visibleOnFloor), { preview: false, floorId: currentFloor });
      }

      function drawObjectGroup(objects, layer) {
        const ramps = objects.filter((object) => object.type === 'ramp');
        const triggers = objects.filter((object) => object.type === 'trigger');
        const regular = objects.filter((object) => object.type !== 'trigger' && object.type !== 'ramp');
        ramps.forEach((object) => drawObject(object, layer));
        triggers.forEach((object) => drawObject(object, layer));
        regular.forEach((object) => drawObject(object, layer));
      }

      function drawGrid(level) {
        ctx.save();
        ctx.strokeStyle = '#293039';
        ctx.lineWidth = 1;
        for (let x = 0; x <= level.width; x++) {
          ctx.beginPath();
          ctx.moveTo(x * CELL_SIZE + 0.5, 0);
          ctx.lineTo(x * CELL_SIZE + 0.5, level.height * CELL_SIZE);
          ctx.stroke();
        }
        for (let y = 0; y <= level.height; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * CELL_SIZE + 0.5);
          ctx.lineTo(level.width * CELL_SIZE, y * CELL_SIZE + 0.5);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.font = '10px ui-monospace, SFMono-Regular, Consolas, monospace';
        for (let x = 0; x < level.width; x += 4) ctx.fillText(String(x), x * CELL_SIZE + 4, 12);
        for (let y = 0; y < level.height; y += 4) ctx.fillText(String(y), 4, y * CELL_SIZE + 28);
        ctx.restore();
      }

      function drawObject(object, layer = {}) {
        const meta = TYPE_META[object.type];
        if (!meta) return;
        const x = object.x * CELL_SIZE;
        const y = object.y * CELL_SIZE;
        const w = Math.max(1, object.w || 1) * CELL_SIZE;
        const h = Math.max(1, object.h || 1) * CELL_SIZE;
        const preview = Boolean(layer.preview);
        const selected = !preview && object.id === selectedId;
        const hovered = !preview && object.id === hoveredId && !dragState;
        ctx.save();
        if (preview) {
          ctx.globalAlpha = 0.28;
          ctx.setLineDash([4, 4]);
        }

        if (object.type === 'trigger') {
          ctx.fillStyle = hexToRgba(meta.color, preview ? 0.1 : 0.18);
          ctx.strokeStyle = preview ? (layer.floorId < currentFloor ? '#8bb5ff' : '#ffd27a') : selected ? '#ffffff' : hovered ? '#f1d36d' : meta.color;
          if (!preview) ctx.setLineDash([6, 5]);
          ctx.lineWidth = selected || hovered ? 3 : 2;
          ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
          ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
        } else {
          ctx.fillStyle = object.type === 'wall' ? '#66736d' : hexToRgba(meta.color, 0.82);
          ctx.strokeStyle = preview ? (layer.floorId < currentFloor ? '#8bb5ff' : '#ffd27a') : selected ? '#ffffff' : hovered ? '#f1d36d' : shade(meta.color, -24);
          ctx.lineWidth = selected || hovered ? 3 : 1.5;
          roundRect(ctx, x + 4, y + 4, w - 8, h - 8, 5);
          ctx.fill();
          ctx.stroke();

          if (object.type === 'ramp') {
            ctx.strokeStyle = '#392812';
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (object.direction === 'west' || object.direction === 'east') {
              ctx.moveTo(x + 8, y + h - 10);
              ctx.lineTo(x + w - 8, y + 10);
            } else {
              ctx.moveTo(x + 8, y + 8);
              ctx.lineTo(x + w - 8, y + h - 8);
            }
            ctx.stroke();
          }
        }

        const label = object.type === 'wall' ? '' : meta.icon;
        if (label) {
          ctx.fillStyle = '#101214';
          ctx.font = '700 12px ui-monospace, SFMono-Regular, Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x + w / 2, y + h / 2);
        }

        if (selected) {
          ctx.setLineDash([]);
          ctx.strokeStyle = '#61d394';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
        } else if (hovered) {
          ctx.setLineDash([]);
          ctx.strokeStyle = '#f1d36d';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
        }
        ctx.restore();
      }

      function roundRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + width - r, y);
        context.quadraticCurveTo(x + width, y, x + width, y + r);
        context.lineTo(x + width, y + height - r);
        context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        context.lineTo(x + r, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
      }

      function hexToRgba(hex, alpha) {
        const value = hex.replace('#', '');
        const r = parseInt(value.slice(0, 2), 16);
        const g = parseInt(value.slice(2, 4), 16);
        const b = parseInt(value.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function shade(hex, amount) {
        const value = hex.replace('#', '');
        const channels = [0, 2, 4]
          .map((index) => parseInt(value.slice(index, index + 2), 16))
          .map((channel) => clamp(channel + amount, 0, 255));
        return `#${channels.map((channel) => channel.toString(16).padStart(2, '0')).join('')}`;
      }

      function renderMeta() {
        const level = getLevel();
        const counts = countBy(allObjects(level), 'type');
        const previewLabels = getPreviewFloorIds().map(floorLabel);
        dom.sceneName.textContent = `${level.name} / ${floorLabel(currentFloor)}`;
        dom.sceneStats.textContent = `${level.width}x${level.height} / ${Object.values(counts).reduce((a, b) => a + b, 0)} objects${previewLabels.length ? ` / 预览 ${previewLabels.join(', ')}` : ''}`;
        dom.projectMeta.textContent = `${project.levels.length} levels`;
        dom.schemaText.textContent = `schema v${project.version}`;
      }

      function getDebugSnapshot() {
        const level = getLevel();
        const objects = allObjects(level);
        return {
          version: project.version,
          sharedContract: SHARED_DATA.getContractState?.('editor') || {},
          sharedUiContract: SHARED_UI.getContractState?.('editor') || {},
          toolUi: {
            bodyClass: document.body.classList.contains('al-tool-page')
          },
          levelCount: project.levels.length,
          currentLevelId,
          currentFloor,
          undoDepth: undoStack.length,
          floorPreview: {
            previous: floorPreview.previous,
            next: floorPreview.next,
            floorIds: getPreviewFloorIds()
          },
          activeTool,
          selectedId,
          hoveredId,
          canvas: {
            width: dom.mapCanvas.width,
            height: dom.mapCanvas.height
          },
          level: {
            id: level.id,
            name: level.name,
            width: level.width,
            height: level.height,
            visibleCount: objects.filter(visibleOnFloor).length,
            previewCount: getPreviewFloorIds()
              .flatMap((floorId) => objects.filter((object) => objectOnFloor(object, floorId) && !visibleOnFloor(object)))
              .length,
            counts: countBy(objects, 'type')
          },
          hasLocalSave: hasStorageText(STORAGE_KEY)
        };
      }

      function renderLevelControls() {
        dom.levelSelect.innerHTML = project.levels
          .map((level) => option(level.id, level.name))
          .join('');
        dom.levelSelect.value = currentLevelId;

        dom.floorSwitch.innerHTML = FLOORS.map(
          (floor) =>
            `<button type="button" data-floor="${floor.id}" class="${floor.id === currentFloor ? 'active' : ''}">${floor.label}</button>`
        ).join('');

        const previous = adjacentFloorId(-1);
        const next = adjacentFloorId(1);
        dom.showPrevFloor.checked = floorPreview.previous && previous !== null;
        dom.showPrevFloor.disabled = previous === null;
        dom.prevFloorLabel.textContent = previous === null ? '无上一层' : `显示上一层 ${floorLabel(previous)}`;
        dom.showNextFloor.checked = floorPreview.next && next !== null;
        dom.showNextFloor.disabled = next === null;
        dom.nextFloorLabel.textContent = next === null ? '无下一层' : `显示下一层 ${floorLabel(next)}`;

        const level = getLevel();
        dom.levelInspector.innerHTML = `
          <label>名称<input data-level-field="name" value="${escapeAttr(level.name)}" /></label>
          <div class="grid-two">
            <label>宽<input type="number" min="8" max="80" data-level-field="width" value="${level.width}" /></label>
            <label>高<input type="number" min="8" max="80" data-level-field="height" value="${level.height}" /></label>
          </div>
          <label>ID<input data-level-field="id" value="${escapeAttr(level.id)}" /></label>
          <label>备注<textarea data-level-field="notes">${escapeHtml(level.notes || '')}</textarea></label>
        `;
      }

      function renderPalette() {
        const groups = new Map();
        for (const type of PALETTE_ORDER) {
          const meta = TYPE_META[type];
          if (!groups.has(meta.group)) groups.set(meta.group, []);
          groups.get(meta.group).push({ type, meta });
        }
        dom.palettePanel.innerHTML = [...groups.entries()]
          .map(
            ([group, entries]) => `
            <div class="section">
              <h2 class="section-title">${escapeHtml(group)}</h2>
              <div class="palette">
                ${entries
                  .map(
                    ({ type, meta }) => `
                    <div class="palette-item ${activeTool === type ? 'active' : ''}" draggable="${type !== 'select'}" data-tool="${type}">
                      <span class="palette-icon" style="${colorVarStyle(meta.color)}">${escapeHtml(meta.icon)}</span>
                      <span>
                        <span class="palette-name">${escapeHtml(meta.name)}</span>
                        <span class="palette-code">${escapeHtml(type)}</span>
                      </span>
                      ${swatchHtml(meta.color)}
                    </div>`
                  )
                  .join('')}
              </div>
            </div>`
          )
          .join('');
      }

      function renderInspector() {
        const object = findObject(selectedId);
        if (!object) {
          dom.objectInspector.innerHTML = `<div class="empty">未选择对象</div>`;
          return;
        }

        const meta = TYPE_META[object.type];
        const common = `
          <div class="row">
            <span class="pill">${escapeHtml(meta.name)}</span>
            <button id="cloneObjectBtn" title="复制对象">⧉</button>
            <button id="deleteObjectBtn" class="danger" title="删除对象">×</button>
          </div>
          <label>标签<input data-path="label" value="${escapeAttr(object.label || '')}" /></label>
          <label>ID<input data-path="id" value="${escapeAttr(object.id)}" /></label>
          <div class="grid-three">
            <label>X<input type="number" data-path="x" value="${object.x}" /></label>
            <label>Y<input type="number" data-path="y" value="${object.y}" /></label>
            <label>层<select data-path="floor">${floorOptions(object.floor)}</select></label>
          </div>
          <div class="${object.type === 'ramp' ? 'grid-two' : 'grid-three'}">
            <label>宽<input type="number" min="1" data-path="w" value="${object.w || 1}" /></label>
            <label>高<input type="number" min="1" data-path="h" value="${object.h || 1}" /></label>
            ${object.type === 'ramp' ? '' : `<label>层高<select data-path="floorSpan">${floorSpanOptions(object)}</select></label>`}
          </div>
        `;
        dom.objectInspector.innerHTML = common + renderTypeFields(object);
      }

      function renderTypeFields(object) {
        if (object.type === 'keyDoor' || object.type === 'hiddenDoor') {
          return `
            <div class="grid-two">
              <label>门 ID<input data-path="doorId" value="${escapeAttr(object.doorId || '')}" /></label>
              <label>钥匙 ID<input data-path="requiredKeyId" value="${escapeAttr(object.requiredKeyId || '')}" /></label>
            </div>
            <label class="row"><input type="checkbox" data-path="locked" ${object.locked ? 'checked' : ''} /> 锁定</label>
            ${renderInteractionFields(object)}
          `;
        }
        if (object.type === 'key') {
          return `
            <div class="grid-two">
              <label>钥匙 ID<input data-path="keyId" value="${escapeAttr(object.keyId || '')}" /></label>
              <label>绑定门<select data-path="boundDoorId">${doorOptions(object.boundDoorId)}</select></label>
            </div>
          `;
        }
        if (object.type === 'terminal') {
          return `
            <label>终端文本<textarea data-path="message">${escapeHtml(object.message || '')}</textarea></label>
            ${renderInteractionFields(object)}
          `;
        }
        if (object.type === 'npc') {
          return `
            <label>NPC ID<input data-path="npcId" value="${escapeAttr(object.npcId || '')}" /></label>
            ${renderInteractionFields(object)}
          `;
        }
        if (object.type === 'exit') {
          return `
            <label>出口 ID<input data-path="exitId" value="${escapeAttr(object.exitId || '')}" /></label>
            <div class="grid-two">
              <label>目标关卡<select data-path="targetLevelId">${levelOptions(object.targetLevelId)}</select></label>
              <label>目标入口<input data-path="targetEntranceId" value="${escapeAttr(object.targetEntranceId || '')}" /></label>
            </div>
            <label>目标楼层<select data-path="targetFloor">${floorOptions(object.targetFloor ?? currentFloor)}</select></label>
          `;
        }
        if (object.type === 'entrance') {
          return `<label>入口 ID<input data-path="entranceId" value="${escapeAttr(object.entranceId || '')}" /></label>`;
        }
        if (object.type === 'ramp') {
          return `
            <div class="grid-two">
              <label>底层<select data-path="floorFrom">${floorOptions(object.floorFrom)}</select></label>
              <label>高层<select data-path="floorTo">${floorOptions(object.floorTo)}</select></label>
            </div>
            <label>方向<select data-path="direction">
              ${option('north', '北', object.direction)}
              ${option('east', '东', object.direction)}
              ${option('south', '南', object.direction)}
              ${option('west', '西', object.direction)}
            </select></label>
          `;
        }
        if (object.type === 'enemy') {
          return `
            <div class="grid-two">
              <label>敌人类型<select data-path="enemyKind">
                ${optionsHtml(ENEMY_KIND_OPTIONS, object.enemyKind)}
              </select></label>
              <label>巡逻<select data-path="patrol">
                ${option('idle', '固定', object.patrol)}
                ${option('loop', '循环', object.patrol)}
                ${option('area', '区域', object.patrol)}
              </select></label>
            </div>
          `;
        }
        if (object.type === 'ammo' || object.type === 'medkit') {
          return `<label>数量<input type="number" min="1" data-path="amount" value="${object.amount || 1}" /></label>`;
        }
        if (object.type === 'weapon') {
          return `
            <div class="grid-two">
              <label>武器<select data-path="weaponKind">
                ${option('sidearm', 'SIDEARM', object.weaponKind)}
                ${option('scatter', 'SCATTER', object.weaponKind)}
                ${option('rail', 'RAIL', object.weaponKind)}
              </select></label>
              <label>附带弹药<input type="number" min="0" data-path="ammo" value="${object.ammo || 0}" /></label>
            </div>
          `;
        }
        if (object.type === 'trigger') {
          return renderTriggerFields(object);
        }
        return '';
      }

      function renderInteractionFields(object) {
        object.interaction ||= defaultInteraction('dialog');
        object.interaction.effect ||= defaultEffect('dialog');
        return `
          <h2 class="section-title">交互触发</h2>
          <div class="grid-two">
            <label>方式<select data-path="interaction.mode">
              ${option('interact', '按键', object.interaction.mode)}
              ${option('touch', '进入', object.interaction.mode)}
            </select></label>
            <label>次数<select data-path="interaction.once">
              ${option('true', '一次', String(object.interaction.once))}
              ${option('false', '重复', String(object.interaction.once))}
            </select></label>
          </div>
          ${renderEffectFields('interaction.effect', object.interaction.effect)}
        `;
      }

      function renderTriggerFields(object) {
        object.effect ||= defaultEffect('dialog');
        return `
          <div class="grid-two">
            <label>触发器 ID<input data-path="triggerId" value="${escapeAttr(object.triggerId || '')}" /></label>
            <label>次数<select data-path="once">
              ${option('true', '一次', String(object.once))}
              ${option('false', '重复', String(object.once))}
            </select></label>
          </div>
          ${renderEffectFields('effect', object.effect)}
        `;
      }

      function renderEffectFields(prefix, effect) {
        effect ||= defaultEffect('dialog');
        const valuePath = (field) => `${prefix}.${field}`;
        const type = effect.type || 'dialog';
        let extra = '';
        if (type === 'heal') {
          extra = `<label>回血<input type="number" min="1" data-path="${valuePath('healAmount')}" value="${effect.healAmount || 20}" /></label>`;
        } else if (type === 'dialog') {
          extra = `<label>对话<textarea data-path="${valuePath('dialog')}">${escapeHtml(effect.dialog || '')}</textarea></label>`;
        } else if (type === 'teleport') {
          extra = `
            <div class="grid-two">
              <label>目标关卡<select data-path="${valuePath('targetLevelId')}">${levelOptions(effect.targetLevelId)}</select></label>
              <label>目标入口<input data-path="${valuePath('targetEntranceId')}" value="${escapeAttr(effect.targetEntranceId || '')}" /></label>
            </div>
            <label>目标楼层<select data-path="${valuePath('targetFloor')}">${floorOptions(effect.targetFloor ?? currentFloor)}</select></label>
          `;
        } else if (type === 'openDoor') {
          extra = `<label>打开门<select data-path="${valuePath('doorId')}">${doorOptions(effect.doorId)}</select></label>`;
        } else if (type === 'giveWeapon') {
          extra = `
            <label>武器<select data-path="${valuePath('weaponKind')}">
              ${option('sidearm', 'SIDEARM', effect.weaponKind)}
              ${option('scatter', 'SCATTER', effect.weaponKind)}
              ${option('rail', 'RAIL', effect.weaponKind)}
            </select></label>
          `;
        }
        return `
          <label>效果<select data-path="${valuePath('type')}">
            ${option('dialog', '对话', type)}
            ${option('heal', '回血', type)}
            ${option('teleport', '传送', type)}
            ${option('openDoor', '开门', type)}
            ${option('giveWeapon', '给武器', type)}
          </select></label>
          ${extra}
        `;
      }

      function floorOptions(value) {
        return optionsHtml(FLOORS, String(value), (floor) => String(floor.id), (floor) => floor.label);
      }

      function floorSpanOptions(object) {
        const maxSpan = getMaxFloorSpan(object.floor, FLOORS);
        return Array.from({ length: maxSpan }, (_, index) => {
          const value = index + 1;
          return option(String(value), value === 1 ? '1 层' : `${value} 层`, String(object.floorSpan || 1));
        }).join('');
      }

      function levelOptions(value) {
        return optionsWithEmptyHtml(project.levels, value, (level) => level.id, (level) => level.name);
      }

      function doorOptions(value) {
        const doors = allObjects().filter((object) => object.type === 'keyDoor' || object.type === 'hiddenDoor');
        return optionsWithEmptyHtml(doors, value, (door) => door.doorId || door.id, (door) => door.label || door.doorId || door.id);
      }

      function option(value, label, selected) {
        return optionHtml(value, label, selected);
      }

      function canvasPoint(event) {
        const rect = dom.mapCanvas.getBoundingClientRect();
        const x = Math.floor((event.clientX - rect.left) / CELL_SIZE);
        const y = Math.floor((event.clientY - rect.top) / CELL_SIZE);
        return {
          x: clamp(x, 0, getLevel().width - 1),
          y: clamp(y, 0, getLevel().height - 1)
        };
      }

      function hitTest(point) {
        const objects = allObjects()
          .filter(visibleOnFloor)
          .slice()
          .reverse();
        return (
          objects.find(
            (object) =>
              point.x >= object.x &&
              point.x < object.x + Math.max(1, object.w || 1) &&
              point.y >= object.y &&
              point.y < object.y + Math.max(1, object.h || 1)
          ) || null
        );
      }

      function isPlaceableTool(type) {
        return Boolean(TYPE_META[type]) && type !== 'select' && type !== 'eraser';
      }

      function objectDisplayName(object) {
        return object.label || TYPE_META[object.type]?.name || object.type;
      }

      function objectTypeDetail(object) {
        if (object.type === 'enemy') {
          const enemy = ENEMY_KIND_OPTIONS.find(([value]) => value === object.enemyKind);
          return enemy?.[1] || object.enemyKind || 'enemy';
        }
        if (object.type === 'keyDoor' || object.type === 'hiddenDoor') {
          return `door ${object.doorId || object.id} / key ${object.requiredKeyId || '-'}`;
        }
        if (object.type === 'key') {
          return `key ${object.keyId || object.id} / door ${object.boundDoorId || '-'}`;
        }
        if (object.type === 'exit') {
          return `to ${object.targetLevelId || '-'} / ${object.targetEntranceId || '-'}`;
        }
        if (object.type === 'trigger') {
          return `${object.effect?.type || 'effect'} / ${object.once ? 'once' : 'repeat'}`;
        }
        if (object.type === 'ammo' || object.type === 'medkit') {
          return `amount ${object.amount || 0}`;
        }
        if (object.type === 'weapon') {
          return `${object.weaponKind || 'weapon'} / ammo ${object.ammo || 0}`;
        }
        if (object.type === 'npc') {
          return object.npcId || object.id;
        }
        if (object.type === 'terminal') {
          return object.message || 'terminal';
        }
        return object.id;
      }

      function showObjectTooltip(object, event) {
        const meta = TYPE_META[object.type];
        if (!dom.objectTooltip || !meta) return;
        const floorLabel = getFloorLabel(object.floor ?? currentFloor, FLOORS);
        dom.objectTooltip.innerHTML = `
          <strong>${escapeHtml(objectDisplayName(object))}</strong>
          <span>${escapeHtml(meta.name)} · ${escapeHtml(object.type)}</span>
          <span>${escapeHtml(objectTypeDetail(object))}</span>
          <span>x ${object.x}, y ${object.y} · ${Math.max(1, object.w || 1)}x${Math.max(1, object.h || 1)} · ${escapeHtml(floorLabel)}</span>
        `;
        dom.objectTooltip.hidden = false;
        positionObjectTooltip(event);
      }

      function positionObjectTooltip(event) {
        if (!dom.objectTooltip || dom.objectTooltip.hidden) return;
        const width = dom.objectTooltip.offsetWidth || 220;
        const height = dom.objectTooltip.offsetHeight || 92;
        const left = Math.min(event.clientX + 14, window.innerWidth - width - 10);
        const top = Math.min(event.clientY + 14, window.innerHeight - height - 10);
        dom.objectTooltip.style.left = `${Math.max(10, left)}px`;
        dom.objectTooltip.style.top = `${Math.max(10, top)}px`;
      }

      function hideObjectTooltip() {
        if (dom.objectTooltip) dom.objectTooltip.hidden = true;
      }

      function clearHover() {
        hoveredId = null;
        hideObjectTooltip();
      }

      function clearSelection() {
        selectedId = null;
        clearHover();
      }

      function updateHover(point, event) {
        const hit = hitTest(point);
        const nextHoveredId = hit?.id || null;
        if (hoveredId !== nextHoveredId) {
          hoveredId = nextHoveredId;
          render();
        }
        if (hit) showObjectTooltip(hit, event);
        else hideObjectTooltip();
      }

      function placeTool(type, point, options = {}) {
        if (type === 'select') {
          selectedId = hitTest(point)?.id || null;
          render();
          return false;
        }

        const level = getLevel();
        if (type === 'eraser') {
          const hit = hitTest(point);
          if (hit) {
            if (!options.skipUndo) recordUndo('擦除对象');
            selectedId = hit.id;
            deleteSelected({ skipUndo: true });
            return true;
          }
          return false;
        }

        if (type === 'wall') {
          const existing = level.objects.find(
            (object) => object.type === 'wall' && object.floor === currentFloor && object.x === point.x && object.y === point.y
          );
          if (existing) {
            selectedId = existing.id;
            render();
            return false;
          }
        }

        if (!options.skipUndo) recordUndo(`放置${TYPE_META[type].name}`);
        const object = createObject(type, point.x, point.y, currentFloor);
        if (type === 'trigger') level.triggers.push(object);
        else level.objects.push(object);
        selectedId = object.id;
        clampObject(object, level);
        touchProject();
        setStatus(`${TYPE_META[type].name} placed at ${point.x}, ${point.y}`);
        render();
        return true;
      }

      function selectObject(id) {
        selectedId = id;
        render();
      }

      function deleteSelected(options = {}) {
        const level = getLevel();
        const object = findObject(selectedId);
        if (!object) return;
        if (!options.skipUndo) recordUndo('删除对象');
        const collection = getCollectionForObject(level, object);
        const index = collection.findIndex((entry) => entry.id === selectedId);
        if (index >= 0) collection.splice(index, 1);
        clearSelection();
        touchProject();
        setStatus('Object deleted');
        render();
      }

      function cloneSelected() {
        const level = getLevel();
        const object = findObject(selectedId);
        if (!object) return;
        recordUndo('复制对象');
        const clone = structuredClone(object);
        clone.id = makeId(object.type);
        clone.label = `${object.label || TYPE_META[object.type].name} copy`;
        clone.x = clamp(clone.x + 1, 0, level.width - Math.max(1, clone.w || 1));
        clone.y = clamp(clone.y + 1, 0, level.height - Math.max(1, clone.h || 1));
        getCollectionForObject(level, clone).push(clone);
        selectedId = clone.id;
        touchProject();
        render();
      }

      function setStatus(message) {
        dom.statusText.textContent = message;
      }

      function touchProject() {
        touchSharedProject(project);
      }

      function saveProject() {
        touchProject();
        saveStorageJson(STORAGE_KEY, project);
        setStatus(`Saved ${new Date().toLocaleTimeString()}`);
      }

      function loadProject() {
        const raw = readStorageText(STORAGE_KEY);
        if (!raw) {
          setStatus('No local save');
          return;
        }
        loadFromJson(raw, 'Local save loaded');
      }

      function loadFromJson(raw, message) {
        try {
          const next = validateProject(parseJson(raw));
          recordUndo('读取项目');
          project = next;
          currentLevelId = project.levels[0].id;
          currentFloor = project.levels[0].floors?.[0] ?? 0;
          clearSelection();
          setStatus(message);
          render();
        } catch (error) {
          setStatus(`Import failed: ${error.message}`);
        }
      }

      function validateProject(data) {
        const normalized = SHARED_DATA.normalizeEditorProject(data, { cellSize: CELL_SIZE });
        if (!normalized) throw new Error('invalid editor project');
        return normalized;
      }

      function exportProject() {
        touchProject();
        downloadTextFile(createJsonDownloadPayload(project, 'ascii-labyrinth-levels'));
        setStatus('JSON exported');
      }

      function addLevel() {
        recordUndo('新增关卡');
        const id = `level-${project.levels.length + 1}`;
        const level = createLevel(id, `关卡 ${project.levels.length + 1}`, 24, 16, false);
        level.objects.push(createObject('entrance', 2, 2, 0, { entranceId: `entry-${project.levels.length + 1}` }));
        project.levels.push(level);
        currentLevelId = level.id;
        clearSelection();
        touchProject();
        render();
      }

      function duplicateLevel() {
        recordUndo('复制关卡');
        const source = getLevel();
        const clone = structuredClone(source);
        clone.id = makeId('level');
        clone.name = `${source.name} copy`;
        clone.objects.forEach((object) => (object.id = makeId(object.type)));
        clone.triggers.forEach((object) => (object.id = makeId(object.type)));
        project.levels.push(clone);
        currentLevelId = clone.id;
        clearSelection();
        touchProject();
        render();
      }

      function deleteLevel() {
        if (project.levels.length <= 1) {
          setStatus('At least one level is required');
          return;
        }
        recordUndo('删除关卡');
        const index = project.levels.findIndex((level) => level.id === currentLevelId);
        if (index >= 0) project.levels.splice(index, 1);
        currentLevelId = project.levels[0].id;
        clearSelection();
        touchProject();
        render();
      }

      function updateLevelField(target) {
        const level = getLevel();
        const field = target.dataset.levelField;
        const oldId = level.id;
        let value = target.value;
        if (field === 'width' || field === 'height') value = Math.max(8, Math.min(80, Number(value) || 8));
        if (field === 'id') value = String(value).trim() || oldId;
        if (level[field] === value) return;
        recordUndo('修改关卡');
        level[field] = value;
        if (field === 'id') {
          project.levels.forEach((candidate) => {
            if (candidate !== level) {
              candidate.objects.forEach((object) => {
                if (object.targetLevelId === oldId) object.targetLevelId = value;
              });
              candidate.triggers.forEach((trigger) => {
                if (trigger.effect?.targetLevelId === oldId) trigger.effect.targetLevelId = value;
              });
            }
          });
          currentLevelId = value;
        }
        allObjects(level).forEach((object) => clampObject(object, level));
        touchProject();
        render();
      }

      function updateObjectField(target) {
        const object = findObject(selectedId);
        if (!object) return;
        const path = target.dataset.path;
        let value = target.type === 'checkbox' ? target.checked : target.value;
        const lastPart = path.split('.').at(-1);
        const numericFields = new Set(['x', 'y', 'w', 'h', 'floor', 'floorSpan', 'floorFrom', 'floorTo', 'targetFloor', 'amount', 'ammo', 'healAmount']);
        if (target.type === 'number' || numericFields.has(lastPart)) value = Number(value);
        if (value === 'true') value = true;
        if (value === 'false') value = false;
        if (getByPath(object, path) === value) return;
        recordUndo('修改对象');
        setByPath(object, path, value);
        if (path === 'id') selectedId = value;
        if (path.endsWith('.type')) {
          const effectPath = path.replace(/\.type$/, '');
          const effect = getByPath(object, effectPath);
          Object.assign(effect, defaultEffect(value), { type: value });
        }
        clampObject(object);
        touchProject();
        render();
      }

      bindDelegatedClickHandlers(dom, {
        palettePanel: ['[data-tool]', (item) => {
          activeTool = item.dataset.tool;
          clearHover();
          render();
          setStatus(`${TYPE_META[activeTool].name} selected`);
        }]
      });

      dom.palettePanel.addEventListener('dragstart', (event) => {
        const item = event.target.closest('[data-tool]');
        if (!item) return;
        if (!isPlaceableTool(item.dataset.tool) && item.dataset.tool !== 'eraser') {
          event.preventDefault();
          return;
        }
        event.dataTransfer.setData('application/x-ascii-tool', item.dataset.tool);
        event.dataTransfer.effectAllowed = 'copy';
      });

      dom.mapCanvas.addEventListener('dragover', (event) => {
        event.preventDefault();
      });

      dom.mapCanvas.addEventListener('drop', (event) => {
        event.preventDefault();
        const type = event.dataTransfer.getData('application/x-ascii-tool');
        if (!isPlaceableTool(type) && type !== 'eraser') return;
        placeTool(type, canvasPoint(event));
      });

      dom.mapCanvas.addEventListener('pointerdown', (event) => {
        dom.mapCanvas.setPointerCapture(event.pointerId);
        const point = canvasPoint(event);
        const hit = hitTest(point);
        hideObjectTooltip();

        if (activeTool === 'select') {
          if (!hit) {
            clearSelection();
            render();
            return;
          }
          if (event.shiftKey) {
            selectedId = hit.id;
            cloneSelected();
          } else {
            selectedId = hit.id;
          }
          const object = findObject(selectedId);
          if (!object) return;
          dragState = {
            mode: 'move',
            id: selectedId,
            startPoint: point,
            startX: object.x,
            startY: object.y,
            undoRecorded: false
          };
          render();
          return;
        }

        const changed = placeTool(activeTool, point);
        if (activeTool === 'wall' || activeTool === 'eraser') {
          dragState = { mode: activeTool, last: point, undoRecorded: changed };
          render();
        }
      });

      dom.mapCanvas.addEventListener('pointermove', (event) => {
        const point = canvasPoint(event);
        dom.cursorReadout.textContent = `x ${point.x} / y ${point.y}`;
        if (!dragState) {
          updateHover(point, event);
          return;
        }

        hideObjectTooltip();
        if (dragState.mode === 'move') {
          const object = findObject(dragState.id);
          if (!object) return;
          const nextX = dragState.startX + point.x - dragState.startPoint.x;
          const nextY = dragState.startY + point.y - dragState.startPoint.y;
          if (object.x === nextX && object.y === nextY) return;
          if (!dragState.undoRecorded) {
            recordUndo('移动对象');
            dragState.undoRecorded = true;
          }
          object.x = nextX;
          object.y = nextY;
          clampObject(object);
          touchProject();
          render();
        } else if ((dragState.mode === 'wall' || dragState.mode === 'eraser') && (dragState.last.x !== point.x || dragState.last.y !== point.y)) {
          const changed = placeTool(dragState.mode, point, { skipUndo: dragState.undoRecorded });
          if (changed) dragState.undoRecorded = true;
          dragState.last = point;
        }
      });

      dom.mapCanvas.addEventListener('pointerup', (event) => {
        if (dragState?.mode === 'move') {
          const object = findObject(dragState.id);
          if (object) setStatus(`${objectDisplayName(object)} moved to ${object.x}, ${object.y}`);
        }
        if (dom.mapCanvas.hasPointerCapture(event.pointerId)) dom.mapCanvas.releasePointerCapture(event.pointerId);
        dragState = null;
        render();
      });

      dom.mapCanvas.addEventListener('pointercancel', (event) => {
        if (dom.mapCanvas.hasPointerCapture(event.pointerId)) dom.mapCanvas.releasePointerCapture(event.pointerId);
        dragState = null;
        hideObjectTooltip();
        render();
      });

      dom.mapCanvas.addEventListener('pointerleave', () => {
        if (dragState) return;
        clearHover();
        render();
      });

      bindDelegatedClickHandlers(dom, {
        floorSwitch: ['[data-floor]', (button) => {
          currentFloor = Number(button.dataset.floor);
          clearSelection();
          render();
        }]
      });

      bindDelegatedChangeHandlers(dom, {
        levelInspector: ['[data-level-field]', updateLevelField],
        objectInspector: ['[data-path]', updateObjectField]
      });

      bindDelegatedClickHandlers(dom, {
        objectInspector: [
          ['#deleteObjectBtn', () => deleteSelected()],
          ['#cloneObjectBtn', () => cloneSelected()]
        ]
      });

      bindClickHandlers(dom, {
        addLevelBtn: addLevel,
        duplicateLevelBtn: duplicateLevel,
        deleteLevelBtn: deleteLevel,
        undoBtn: undoLastEdit,
        saveBtn: saveProject,
        loadBtn: loadProject,
        exportBtn: exportProject,
        importBtn: () => dom.importFile.click()
      });

      bindChangeHandlers(dom, {
        levelSelect: (event) => {
          currentLevelId = event.target.value;
          clearSelection();
          render();
        },
        showPrevFloor: (event) => {
          floorPreview.previous = event.target.checked;
          clearHover();
          render();
        },
        showNextFloor: (event) => {
          floorPreview.next = event.target.checked;
          clearHover();
          render();
        },
        importFile: async (event) => {
          await importTextFile(event, loadFromJson);
        }
      });

      window.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && !event.shiftKey) {
          if (document.activeElement.matches('input, textarea, select')) return;
          event.preventDefault();
          undoLastEdit();
          return;
        }
        if (event.key === 'Delete' || event.key === 'Backspace') {
          if (document.activeElement.matches('input, textarea, select')) return;
          deleteSelected();
        }
        if (event.key === 'Escape') {
          clearSelection();
          render();
        }
      });

      window.addEventListener('resize', render);

      window.__ASCII_EDITOR_DEBUG__ = getDebugSnapshot;

      render();
    </script>
  </body>
</html>
