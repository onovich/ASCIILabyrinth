<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASCII 3D FPS 游戏 (彩色分层版)</title>
    <link rel="stylesheet" href="./shared/ui-system.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--al-color-green);
            font-family: var(--al-font-mono);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }

        #ui-layer {
            top: 10px;
            left: 12px;
            width: min(360px, calc(100vw - 24px));
        }

        #mission-layer {
            top: 10px;
            right: 12px;
            width: min(470px, calc(100vw - 24px));
        }

        #log-layer {
            left: 12px;
            bottom: 12px;
            width: min(410px, calc(100vw - 24px));
        }

    </style>
</head>
<body>

    <div id="ui-layer" class="al-hud al-panel" data-title="OPS / STATUS"></div>
    <div id="mission-layer" class="al-hud al-panel" data-title="MISSION / LINK"></div>
    <div id="log-layer" class="al-hud al-panel" data-title="RADIO / LOG" aria-live="polite"></div>

    <div id="metrics-store" class="al-hidden">
        <span id="health-val">100</span>
        <span id="ammo-val">20</span>
        <span id="score-val">0</span>
    </div>
    
    <div id="crosshair" class="al-crosshair">┼</div>
    <div id="damage-flash" class="al-damage-flash"></div>
    
    <!-- 替换为 Canvas 作为 ASCII 输出载体 -->
    <canvas id="ascii-canvas" class="al-fullscreen-canvas"></canvas>

    <div id="password-panel" class="terminal-modal al-modal al-modal-centered">
        <h2 id="password-title" class="al-modal-title">EXIT ACCESS</h2>
        <pre id="password-copy" class="al-modal-copy">输入隐藏房间获得的四位撤离密码。</pre>
        <input id="password-input" class="al-input al-input-code" maxlength="4" inputmode="numeric" autocomplete="off">
        <button id="password-submit" class="al-button al-button-terminal">确认 (ENTER)</button>
        <button id="password-cancel" class="al-button al-button-terminal">取消 (ESC)</button>
    </div>

    <div id="ending-panel" class="terminal-modal al-modal al-modal-centered">
        <h1 id="ending-title" class="al-modal-title">EXTRACTION COMPLETE</h1>
        <pre id="ending-text" class="al-modal-copy"></pre>
        <button id="ending-restart" class="al-button al-button-terminal" onclick="location.reload()">再次部署 (RESTART)</button>
    </div>

    <div id="game-over" class="terminal-modal al-modal al-modal-centered">
        <h1 id="game-over-title" class="al-modal-title">任务失败 (YOU DIED)</h1>
        <p>最终得分: <span id="final-score">0</span></p>
        <button id="game-over-restart" class="al-button al-button-terminal" onclick="location.reload()">重新部署 (RESTART)</button>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 新增：引入 lil-gui 开发者面板库 (修复了版本号) -->
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.js"></script>
    <script src="./shared/ui-system.js"></script>
    <script src="./shared/game-schema.js"></script>

    <script>
        // ==========================================
        // 1. 游戏状态与核心配置
        // ==========================================
        const SHARED_DATA = window.ASCII_LABYRINTH_DATA || {};
        const gameState = {
            health: 100,
            ammo: 20,
            score: 0,
            weaponIndex: 0,
            hasKey: false,
            foundCode: false,
            escaped: false,
            objective: '活下来，找到钥匙并逃离设施。',
            nearbyAction: '',
            isGameOver: false,
            isPaused: false // 新增：暂停状态标志
        };
        const EXIT_CODE = '3142';
        const messageLog = [];
        const weapons = (SHARED_DATA.WEAPON_DEFS || [
            {
                id: 'sidearm',
                name: 'SIDEARM',
                cost: 1,
                pellets: 1,
                spread: 0,
                cooldown: 220,
                damage: 1,
                speed: 21,
                lightColor: 0xffdd55
            },
            {
                id: 'scatter',
                name: 'SCATTER',
                cost: 3,
                pellets: 6,
                spread: 0.16,
                cooldown: 720,
                damage: 1,
                speed: 18,
                lightColor: 0xff9955
            }
        ]).map((weapon) => ({ ...weapon }));
        let lastShotAt = 0;
        let audioContext = null;

        const bgm = new Audio('./bgm/ascii_fps_retro_modern_loop.ogg');
        bgm.loop = true;
        bgm.preload = 'auto';
        bgm.volume = 0.45;

        function ensureAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') audioContext.resume();
        }

        function playTone(freq, duration = 0.08, type = 'square', gain = 0.04) {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const amp = audioContext.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            amp.gain.setValueAtTime(gain, audioContext.currentTime);
            amp.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
            osc.connect(amp).connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }

        function playSfx(name) {
            ensureAudio();
            const patterns = {
                shoot: [[150, 0.04, 'sawtooth', 0.05], [80, 0.07, 'square', 0.03]],
                shotgun: [[95, 0.08, 'sawtooth', 0.07], [180, 0.04, 'square', 0.04]],
                pickup: [[740, 0.06, 'triangle', 0.04], [980, 0.08, 'triangle', 0.03]],
                key: [[520, 0.08, 'triangle', 0.05], [1040, 0.1, 'triangle', 0.04]],
                door: [[220, 0.12, 'sawtooth', 0.04], [330, 0.08, 'triangle', 0.03]],
                error: [[110, 0.12, 'square', 0.05]],
                success: [[660, 0.08, 'triangle', 0.04], [880, 0.08, 'triangle', 0.04], [1320, 0.12, 'triangle', 0.04]],
                damage: [[55, 0.12, 'sawtooth', 0.06]],
                enemyDown: [[180, 0.06, 'square', 0.04], [90, 0.1, 'sawtooth', 0.04]]
            };
            for (const args of patterns[name] || []) playTone(...args);
        }

        function startBgm() {
            ensureAudio();
            const playPromise = bgm.play();

            if (!playPromise || typeof playPromise.then !== 'function') {
                return;
            }

            playPromise.then(() => {
                document.removeEventListener('pointerdown', startBgm);
                window.removeEventListener('touchstart', startBgm);
                window.removeEventListener('keydown', startBgm);
            }).catch(() => {});
        }

        startBgm();

        // 新增：多种 ASCII 字符集预设（按亮度从暗到亮排列）
        const ASCII_SETS = {
            'Classic (经典)': " .:-=+*#%@",
            'Detailed (高灰阶)': " .',:;clodxkO0KXNWM",
            'Blocks (方块)': " ░▒▓█",
            'Binary (骇客)': " 01",
            'Math (数学)': " +-*/=%()[]{}",
            'Stars (星空)': " ✧★✪✫✬✭✮✯✡"
        };
        let currentAsciiChars = ASCII_SETS['Classic (经典)'];
        let postMaterial = null;
        let asciiAtlasTexture = null;

        function buildAsciiAtlasTexture(chars) {
            const cellSize = 32;
            const atlasCanvas = document.createElement('canvas');
            const atlasCtx = atlasCanvas.getContext('2d');
            atlasCanvas.width = cellSize * chars.length;
            atlasCanvas.height = cellSize;
            atlasCtx.clearRect(0, 0, atlasCanvas.width, atlasCanvas.height);
            atlasCtx.fillStyle = '#fff';
            atlasCtx.font = `bold ${Math.floor(cellSize * 0.8)}px 'Courier New', Courier, monospace`;
            atlasCtx.textAlign = 'center';
            atlasCtx.textBaseline = 'middle';
            for (let i = 0; i < chars.length; i++) {
                atlasCtx.fillText(chars[i], i * cellSize + cellSize / 2, cellSize / 2 + 1);
            }
            const texture = new THREE.CanvasTexture(atlasCanvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
            return texture;
        }

        function refreshAsciiAtlas() {
            if (asciiAtlasTexture) asciiAtlasTexture.dispose();
            asciiAtlasTexture = buildAsciiAtlasTexture(currentAsciiChars);
            if (postMaterial) {
                postMaterial.uniforms.tAscii.value = asciiAtlasTexture;
                postMaterial.uniforms.charCount.value = currentAsciiChars.length;
            }
        }
        
        // 渲染分辨率配置
        const PIXEL_SIZE = 14; // 字号大小，稍微调大增加辨识度
        let CHAR_WIDTH, CHAR_HEIGHT;
        let cols, rows;

        // ==========================================
        // 2. Three.js 场景初始化
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        // 添加暗蓝色雾效，增加空间深度感
        scene.fog = new THREE.Fog(0x050a10, 2, 18);

        const asciiCanvas = document.getElementById('ascii-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: asciiCanvas, antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        const renderTarget = new THREE.WebGLRenderTarget(1, 1, {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.NearestFilter,
            format: THREE.RGBAFormat,
            depthBuffer: true
        });

        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
        
        const player = new THREE.Group();
        player.position.set(2, 1, 2);
        scene.add(player);
        
        const pitchObject = new THREE.Group();
        player.add(pitchObject);
        pitchObject.add(camera);

        // 玩家手电筒改为略微偏暖的颜色，不再是惨白
        const flashLight = new THREE.SpotLight(0xeeffcc, 2.5, 20, Math.PI / 4, 0.5, 1);
        flashLight.castShadow = true;
        flashLight.position.set(0, 0, 0);
        pitchObject.add(flashLight);
        pitchObject.add(flashLight.target);
        flashLight.target.position.set(0, 0, -1);

        // 环境光调暗且偏蓝，与手电筒形成冷暖对比
        const ambientLight = new THREE.AmbientLight(0x0a1a2a);
        scene.add(ambientLight);

        // ==========================================
        // 2.5 开发者面板 (Dev UI) 与 Shader 调参设置
        // ==========================================
        const devParams = {
            // 环境光与雾
            ambientColor: '#0a1a2a',
            ambientIntensity: 1.0,
            fogColor: '#050a10',
            fogNear: 2,
            fogFar: 18,
            
            // 动态光源 (手电筒)
            flashColor: '#eeffcc',
            flashIntensity: 2.5,
            flashDistance: 20,
            flashAngle: Math.PI / 4,
            
            // PBR 物理材质调参
            wallColor: '#446655',
            floorColor: '#112233',
            ceilColor: '#1a1a1a',
            roughness: 0.9,
            metalness: 0.0, // 新增金属度
            
            // ASCII Shader (后处理)
            asciiStyle: 'Classic (经典)',
            invertAscii: false,
            noiseThreshold: 10,
            alphaMultiplier: 1.0
        };
        refreshAsciiAtlas();
        const postScene = new THREE.Scene();
        const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        postMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tScene: { value: renderTarget.texture },
                tAscii: { value: asciiAtlasTexture },
                gridSize: { value: new THREE.Vector2(1, 1) },
                charCount: { value: currentAsciiChars.length },
                noiseThreshold: { value: devParams.noiseThreshold / 255 },
                alphaMultiplier: { value: devParams.alphaMultiplier }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position.xy, 0.0, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tScene;
                uniform sampler2D tAscii;
                uniform vec2 gridSize;
                uniform float charCount;
                uniform float noiseThreshold;
                uniform float alphaMultiplier;
                varying vec2 vUv;

                void main() {
                    vec2 cell = floor(vUv * gridSize);
                    vec2 cellUv = fract(vUv * gridSize);
                    vec2 sampleUv = (cell + 0.5) / gridSize;
                    vec3 sceneColor = texture2D(tScene, sampleUv).rgb;
                    float luminance = dot(sceneColor, vec3(0.299, 0.587, 0.114));
                    if (luminance < noiseThreshold) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    float charIndex = floor(luminance * (charCount - 1.0) + 0.5);
                    vec2 atlasUv = vec2((charIndex + cellUv.x) / charCount, 1.0 - cellUv.y);
                    float glyph = texture2D(tAscii, atlasUv).r;
                    float alpha = min(1.0, max(0.15, luminance) * alphaMultiplier) * glyph;
                    vec3 color = sceneColor * (0.3 + glyph * 1.45);
                    gl_FragColor = vec4(mix(vec3(0.0), color, alpha), 1.0);
                }
            `
        });
        postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));

        const gui = new lil.GUI({ title: '⚙️ 开发者光影调参面板' });
        gui.domElement.style.display = 'none'; // 默认隐藏

        // -- 环境光设置 --
        const envFolder = gui.addFolder('环境与全局光 (Environment)');
        envFolder.addColor(devParams, 'ambientColor').name('全局环境光色').onChange(c => ambientLight.color.set(c));
        envFolder.add(devParams, 'ambientIntensity', 0, 5).name('环境光强度').onChange(v => ambientLight.intensity = v);
        envFolder.addColor(devParams, 'fogColor').name('深空雾气颜色').onChange(c => { scene.fog.color.set(c); scene.background.set(c); });
        envFolder.add(devParams, 'fogNear', 0, 10).name('雾气起始距离').onChange(v => scene.fog.near = v);
        envFolder.add(devParams, 'fogFar', 5, 50).name('雾气衰减距离').onChange(v => scene.fog.far = v);

        // -- 探照灯设置 --
        const flashFolder = gui.addFolder('玩家光源 (Flashlight)');
        flashFolder.addColor(devParams, 'flashColor').name('光源颜色').onChange(c => flashLight.color.set(c));
        flashFolder.add(devParams, 'flashIntensity', 0, 10).name('光源强度').onChange(v => flashLight.intensity = v);
        flashFolder.add(devParams, 'flashDistance', 5, 50).name('照射距离').onChange(v => flashLight.distance = v);
        flashFolder.add(devParams, 'flashAngle', 0.1, Math.PI / 2).name('聚光灯角度').onChange(v => flashLight.angle = v);

        // -- 物理材质光照模型设置 --
        const matFolder = gui.addFolder('PBR 物理光照模型 (Materials)');
        matFolder.addColor(devParams, 'wallColor').name('墙壁基础色').onChange(c => wallMat.color.set(c));
        matFolder.addColor(devParams, 'floorColor').name('地板基础色').onChange(c => floorMat.color.set(c));
        matFolder.addColor(devParams, 'ceilColor').name('天花板基础色').onChange(c => ceilMat.color.set(c));
        matFolder.add(devParams, 'roughness', 0, 1).name('粗糙度 (Roughness)').onChange(v => {
            wallMat.roughness = v; floorMat.roughness = v; ceilMat.roughness = v;
        });
        matFolder.add(devParams, 'metalness', 0, 1).name('金属度 (Metalness)').onChange(v => {
            // 调高金属度可以产生非常强烈的镜面高光 (Specular Highlight)
            wallMat.metalness = v; floorMat.metalness = v; ceilMat.metalness = v;
        });

        // -- ASCII Shader 后期管线 --
        const shaderFolder = gui.addFolder('ASCII 后处理着色器 (Shader)');
        shaderFolder.add(devParams, 'asciiStyle', Object.keys(ASCII_SETS)).name('字符集风格').onChange(v => {
            currentAsciiChars = devParams.invertAscii ? ASCII_SETS[v].split('').reverse().join('') : ASCII_SETS[v];
            refreshAsciiAtlas();
        });
        shaderFolder.add(devParams, 'invertAscii').name('反转明暗映射').onChange(v => {
            currentAsciiChars = v ? ASCII_SETS[devParams.asciiStyle].split('').reverse().join('') : ASCII_SETS[devParams.asciiStyle];
            refreshAsciiAtlas();
        });
        shaderFolder.add(devParams, 'noiseThreshold', 0, 50).name('降噪阈值 (过滤暗角)').onChange(v => {
            postMaterial.uniforms.noiseThreshold.value = v / 255;
        });
        shaderFolder.add(devParams, 'alphaMultiplier', 0.1, 3.0).name('透明度全局缩放').onChange(v => {
            postMaterial.uniforms.alphaMultiplier.value = v;
        });

        // ==========================================
        // 3. 地图与场景生成 (调整了材质颜色，形成分层)
        // ==========================================
        const TILE = SHARED_DATA.TILE || {
            WALL: '1',
            EMPTY: '0',
            AMMO: '2',
            HEALTH: '3',
            ENEMY: '4',
            KEY: '5',
            DOOR: '6',
            CLUE: '7',
            EXIT: '8',
            WEAPON: '9'
        };

        function generateFacilityMap() {
            const width = 21;
            const height = 15;
            const grid = Array.from({ length: height }, () => Array(width).fill(TILE.WALL));
            const protectedCells = new Set();

            const keyOf = (x, z) => `${x},${z}`;
            const mark = (x, z) => protectedCells.add(keyOf(x, z));
            const carve = (x, z) => {
                if (x > 0 && x < width - 1 && z > 0 && z < height - 1) grid[z][x] = TILE.EMPTY;
            };
            const carveRect = (x1, z1, x2, z2) => {
                for (let z = z1; z <= z2; z++) for (let x = x1; x <= x2; x++) carve(x, z);
            };
            const carveLine = (x1, z1, x2, z2) => {
                const dx = Math.sign(x2 - x1);
                const dz = Math.sign(z2 - z1);
                for (let x = x1; x !== x2 + dx; x += dx || 1) carve(x, z1);
                for (let z = z1; z !== z2 + dz; z += dz || 1) carve(x2, z);
            };

            carveRect(1, 1, 3, 3);
            carveLine(3, 2, 10, 2);
            carveRect(8, 1, 12, 4);
            carveLine(10, 4, 10, 11);
            carveLine(10, 11, 17, 11);
            carveRect(15, 9, 18, 12);
            carveLine(17, 12, 19, 13);
            carveRect(14, 1, 18, 4);
            grid[2][13] = TILE.DOOR;
            grid[2][17] = TILE.CLUE;
            grid[11][17] = TILE.KEY;
            grid[13][19] = TILE.EXIT;

            for (const [x, z] of [[1, 1], [2, 2], [13, 2], [17, 2], [17, 11], [19, 13]]) mark(x, z);

            const branchSeeds = [
                [5, 2], [10, 6], [12, 11], [16, 10], [9, 3]
            ];
            for (const [sx, sz] of branchSeeds) {
                const length = 2 + Math.floor(Math.random() * 4);
                const horizontal = Math.random() > 0.45;
                const dir = Math.random() > 0.5 ? 1 : -1;
                for (let i = 1; i <= length; i++) {
                    const x = sx + (horizontal ? i * dir : 0);
                    const z = sz + (horizontal ? 0 : i * dir);
                    carve(x, z);
                    if (Math.random() > 0.65) carve(x + (horizontal ? 0 : 1), z + (horizontal ? 1 : 0));
                }
            }

            const emptyCells = [];
            for (let z = 1; z < height - 1; z++) {
                for (let x = 1; x < width - 1; x++) {
                    if (grid[z][x] === TILE.EMPTY && !protectedCells.has(keyOf(x, z))) emptyCells.push([x, z]);
                }
            }

            const place = (tile, count, minDistance = 0) => {
                for (let i = emptyCells.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [emptyCells[i], emptyCells[j]] = [emptyCells[j], emptyCells[i]];
                }
                let placed = 0;
                for (const [x, z] of emptyCells) {
                    if (placed >= count) break;
                    if (grid[z][x] !== TILE.EMPTY) continue;
                    if (Math.hypot(x - 1, z - 1) < minDistance) continue;
                    grid[z][x] = tile;
                    placed++;
                }
            };

            place(TILE.ENEMY, 7, 4);
            place(TILE.AMMO, 5, 2);
            place(TILE.HEALTH, 3, 3);

            return grid.map((row) => row.join(''));
        }

        function createProceduralRuntimeLevel() {
            const map = generateFacilityMap();
            return {
                source: 'procedural',
                levelId: 'procedural-facility',
                levelName: '程序生成设施',
                floor: 0,
                map,
                objectsByCell: {},
                triggers: [],
                startCell: { x: 1, y: 1, entranceId: 'procedural-entry' },
                dimensions: { width: map[0]?.length || 0, height: map.length }
            };
        }

        const isValidRuntimeLevel = SHARED_DATA.isValidRuntimeLevel || ((candidate) => Boolean(
            candidate
            && Array.isArray(candidate.map)
            && candidate.map.length > 0
            && candidate.map.every((row) => typeof row === 'string' && row.length === candidate.map[0].length)
        ));

        function loadRuntimeLevel() {
            const editorLevel = SHARED_DATA.loadRuntimeLevelFromLocalStorage?.({ floor: 0 });
            if (isValidRuntimeLevel(editorLevel)) return editorLevel;
            return createProceduralRuntimeLevel();
        }

        const runtimeLevel = loadRuntimeLevel();
        const levelMap = runtimeLevel.map;
        const countTiles = SHARED_DATA.countTiles || ((map) => map.join('').split('').reduce((acc, ch) => {
            acc[ch] = (acc[ch] || 0) + 1;
            return acc;
        }, {}));
        const countBy = SHARED_DATA.countBy || ((items, getKey) => items.reduce((acc, item, index) => {
            const key = typeof getKey === 'function' ? getKey(item, index) : item?.[getKey];
            if (key) acc[key] = (acc[key] || 0) + 1;
            return acc;
        }, {}));
        const clamp = SHARED_DATA.clamp || ((value, min, max) => Math.max(min, Math.min(max, value)));
        const gridKey = SHARED_DATA.getCellKey || ((x, z) => `${x},${z}`);

        const mapSize = 2; 
        const startCell = runtimeLevel.startCell || { x: 1, y: 1 };
        player.position.set(startCell.x * mapSize, 1, startCell.y * mapSize);
        const walls = [];
        const wallGrid = new Map();
        const enemies = [];
        const items = [];
        const doors = [];
        const terminals = [];
        const exits = [];
        const bullets = [];

        // 新增：特效与粒子全局变量
        const particles = [];
        const effectLights = [];
        let cameraShake = 0;

        // 修改材质，提供色彩基调以供 ASCII 彩色渲染识别
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x446655, roughness: 0.9 }); // 灰绿色墙体
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 1.0 }); // 暗蓝色地板
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1.0 });  // 近黑天花板
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x223355, emissive: 0x001133, roughness: 0.65, metalness: 0.2 });

        function getRuntimeCellObjects(x, z) {
            return runtimeLevel.objectsByCell?.[gridKey(x, z)] || [];
        }

        function getRuntimeCellObject(x, z, type) {
            const objects = getRuntimeCellObjects(x, z);
            return objects.find((object) => object.type === type) || objects[objects.length - 1] || null;
        }

        function addWallCollider(box, x, z, ref = null) {
            const collider = { box, x, z, active: true, ref };
            walls.push(collider);
            const key = gridKey(x, z);
            if (!wallGrid.has(key)) wallGrid.set(key, []);
            wallGrid.get(key).push(collider);
            return collider;
        }

        function getNearbyWallColliders(pos, radius = 1) {
            const gx = Math.round(pos.x / mapSize);
            const gz = Math.round(pos.z / mapSize);
            const found = [];
            for (let z = gz - radius; z <= gz + radius; z++) {
                for (let x = gx - radius; x <= gx + radius; x++) {
                    const bucket = wallGrid.get(gridKey(x, z));
                    if (bucket) found.push(...bucket);
                }
            }
            return found;
        }

        function buildLevel() {
            const worldWidth = levelMap[0].length * mapSize;
            const worldDepth = levelMap.length * mapSize;
            const floorGeo = new THREE.PlaneGeometry(worldWidth + mapSize, worldDepth + mapSize);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set((worldWidth - mapSize) / 2, 0, (worldDepth - mapSize) / 2);
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeo, ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set((worldWidth - mapSize) / 2, mapSize, (worldDepth - mapSize) / 2);
            ceiling.position.y = mapSize;
            scene.add(ceiling);

            const wallGeo = new THREE.BoxGeometry(mapSize, mapSize, mapSize);
            for (let z = 0; z < levelMap.length; z++) {
                for (let x = 0; x < levelMap[z].length; x++) {
                    const type = levelMap[z][x];
                    const posX = x * mapSize;
                    const posZ = z * mapSize;
                    const cellObjects = getRuntimeCellObjects(x, z);
                    const cellObject = cellObjects[cellObjects.length - 1] || null;

                    if (type === TILE.WALL) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(posX, mapSize / 2, posZ);
                        wall.castShadow = true;
                        wall.receiveShadow = true;
                        scene.add(wall);
                        addWallCollider(new THREE.Box3().setFromObject(wall), x, z);
                    } else if (type === TILE.AMMO || type === TILE.HEALTH) {
                        spawnItem(posX, posZ, type === TILE.AMMO ? 'ammo' : 'health', cellObject);
                    } else if (type === TILE.WEAPON) {
                        spawnItem(posX, posZ, 'weapon', cellObject);
                    } else if (type === TILE.ENEMY) {
                        spawnEnemy(posX, posZ, getRuntimeCellObject(x, z, 'enemy'));
                    } else if (type === TILE.KEY) {
                        spawnItem(posX, posZ, 'key', cellObject);
                    } else if (type === TILE.DOOR) {
                        spawnDoor(posX, posZ, x, z, cellObject);
                    } else if (type === TILE.CLUE) {
                        spawnTerminal(posX, posZ, cellObject);
                    } else if (type === TILE.EXIT) {
                        spawnExit(posX, posZ, cellObject);
                    }
                }
            }
        }

                    : type === 'weapon'
                        ? new THREE.CylinderGeometry(0.1, 0.1, 0.7, 8)
                        : new THREE.OctahedronGeometry(0.3);
            const color = type === 'ammo' ? 0x00ffff : type === 'key' ? 0xffdd55 : type === 'weapon' ? 0xff9955 : 0x00ff00;
            const emissive = type === 'ammo' ? 0x003333 : type === 'key' ? 0x664400 : type === 'weapon' ? 0x442000 : 0x113311;
            const mat = new THREE.MeshStandardMaterial({ color, emissive, roughness: 0.42, metalness: type === 'key' ? 0.6 : 0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            if (type === 'weapon') mesh.rotation.z = Math.PI / 2;
            mesh.castShadow = true;
            
            const light = new THREE.PointLight(color, type === 'key' ? 1.2 : 0.6, type === 'key' ? 6 : 4);
            mesh.add(light);

            scene.add(mesh);
            items.push({
                mesh,

            const merged = new Map(baseProfiles.map((profile) => [profile.id, profile]));
            overrideProfiles.forEach((profile) => {
                if (profile?.id && Array.isArray(profile.parts) && profile.parts.length) merged.set(profile.id, profile);

        function createEnemyGeometry(shape) {
            if (shape === 'sphere') return new THREE.SphereGeometry(0.5, 16, 12);
            if (shape === 'cylinder') return new THREE.CylinderGeometry(0.5, 0.5, 1, 16);
            if (shape === 'cone') return new THREE.ConeGeometry(0.5, 1, 16);
            if (shape === 'torus') return new THREE.TorusGeometry(0.5, 0.08, 8, 24);
            if (shape === 'octahedron') return new THREE.OctahedronGeometry(0.5, 0);
            if (shape === 'icosahedron') return new THREE.IcosahedronGeometry(0.5, 0);
            if (shape === 'dodecahedron') return new THREE.DodecahedronGeometry(0.5, 0);
            return new THREE.BoxGeometry(1, 1, 1);
        }

        function createEnemyPart(part) {
            const [, shape, color, emissive, position, rotation, scale, opacity = 1] = part;
            const mesh = new THREE.Mesh(
                createEnemyGeometry(shape),
                new THREE.MeshStandardMaterial({
                    color,
                    emissive,
                    roughness: 0.58,
                    metalness: shape === 'torus' ? 0.25 : 0.05,
                    transparent: opacity < 1,
                    opacity
                })
            );
            mesh.position.set(...position);
            mesh.rotation.set(...rotation);
            mesh.scale.set(...scale);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.baseEmissive = emissive;
            return mesh;
        }

        function setEnemyFlash(enemy, flashing) {
            enemy.group.traverse((child) => {
                if (!child.isMesh || !child.material?.emissive) return;
                child.material.emissive.setHex(flashing ? 0xffaaaa : (child.userData.baseEmissive || 0x000000));
            });
        }

        function buildEnemyModel(profile) {
            const group = new THREE.Group();
            for (const part of profile.parts) {
                group.add(createEnemyPart(part));
            }
            const light = new THREE.PointLight(profile.light, 0.9, 5);
            light.position.y = 0.9;
            group.add(light);
            group.userData.enemyKind = profile.id;
            return group;
        }

        function spawnEnemy(x, z, config = {}) {
            const requestedKind = typeof config === 'string' ? config : config?.enemyKind;
            const profile = activeEnemyProfiles.find((enemy) => enemy.id === requestedKind)
                || activeEnemyProfiles[Math.floor(Math.random() * activeEnemyProfiles.length)];
            const enemyGroup = buildEnemyModel(profile);
            enemyGroup.position.set(x, 0, z);
            scene.add(enemyGroup);
            enemies.push({
                group: enemyGroup,
                kind: profile.id,
                name: profile.name,
                health: profile.health,
                damage: profile.damage || 10,
                reward: profile.reward || 100,
                source: profile.source || 'built-in',
                active: true,
                speed: profile.speed + Math.random() * 0.12,
                flashTimer: 0,
                attackTimer: 0
            });
        }

        function spawnExplosion(pos) {
            // 产生爆炸粒子
            for (let i = 0; i < 15; i++) {
                const size = 0.1 + Math.random() * 0.2;
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff3300 : 0xffaa00 });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                p.position.y += 0.6; 
                // 给粒子随机抛射速度
                const vx = (Math.random() - 0.5) * 8;
                const vy = Math.random() * 8;
                const vz = (Math.random() - 0.5) * 8;
                scene.add(p);
                particles.push({ mesh: p, vx, vy, vz, life: 20 + Math.random() * 15 });
            }
            // 产生爆炸瞬间的高亮闪光
            const burstLight = new THREE.PointLight(0xff5500, 3.0, 8);
            burstLight.position.copy(pos);
            burstLight.position.y += 0.6;
            scene.add(burstLight);
            effectLights.push({ light: burstLight, life: 10 });
        }

        function spawnBullet(direction, weapon) {
            const bulletGeo = new THREE.SphereGeometry(0.1, 4, 4);
            const bulletMat = new THREE.MeshBasicMaterial({ color: weapon.lightColor });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const bulletLight = new THREE.PointLight(weapon.lightColor, weapon.id === 'scatter' ? 1.35 : 2.0, 7);
            bullet.add(bulletLight);

            bullet.position.copy(player.position);
            bullet.position.y += 0.8;

            scene.add(bullet);
            bullets.push({ mesh: bullet, dir: direction.normalize(), life: weapon.id === 'scatter' ? 34 : 60, damage: weapon.damage, speed: weapon.speed });
        }

        function shoot() {
            if (gameState.isGameOver || gameState.escaped || gameState.isPaused) return;
            const weapon = weapons[gameState.weaponIndex];
            const now = performance.now();
            if (now - lastShotAt < weapon.cooldown) return;
            if (gameState.ammo < weapon.cost) {
                playSfx('error');
                pushLog(gameState.ammo <= 0
                    ? `弹药用完，${weapon.name} 无法开火。`
                    : `${weapon.name} 弹药不足：剩余 ${gameState.ammo}/${weapon.cost}。`);
                return;
            }

            lastShotAt = now;
            gameState.ammo -= weapon.cost;
            if (gameState.ammo <= 0) {
                pushLog(`弹药用完：${weapon.name} 打出了最后一发。`);
            } else {
                updateUI();
            }

            const baseDirection = new THREE.Vector3();
            camera.getWorldDirection(baseDirection);
            for (let i = 0; i < weapon.pellets; i++) {
                const direction = baseDirection.clone();
                if (weapon.spread > 0) {
                    direction.x += (Math.random() - 0.5) * weapon.spread;
                    direction.y += (Math.random() - 0.5) * weapon.spread * 0.55;
                    direction.z += (Math.random() - 0.5) * weapon.spread;
                }
                spawnBullet(direction, weapon);
            }
            playSfx(weapon.id === 'scatter' ? 'shotgun' : 'shoot');
        }

        function switchWeapon(index) {
            if (!weapons[index]) return;
            gameState.weaponIndex = index;
            playSfx('pickup');
            pushLog(`武器切换：${weapons[index].name}`);
            updateUI();
        }

        function takeDamage(sourceEnemy = null) {
            gameState.health = Math.max(0, gameState.health - (sourceEnemy?.damage || 10));
            playSfx('damage');
            
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = 0.4;
            setTimeout(() => { flash.style.opacity = 0; }, 100);

            if (gameState.health <= 0) {
                gameState.isGameOver = true;
                pushLog(`被 ${sourceEnemy?.name || '未知敌人'} 杀死。最终得分 ${gameState.score}。`);
                if (document.pointerLockElement) document.exitPointerLock(); // 释放鼠标指针，允许点击 UI
                setElementVisible('game-over', true);
                document.getElementById('final-score').innerText = gameState.score;
            } else {
                updateUI();
            }
        }

        function distanceXZ(a, b) {
            return Math.hypot(a.x - b.x, a.z - b.z);
        }

        function unlockDoor(door) {
            if (!door || !door.active || door.unlocked) return;
            door.unlocked = true;
            door.active = false;
            if (door.collider) door.collider.active = false;
            scene.remove(door.mesh);
            playSfx('door');
            setObjective('进入隐藏房间，读取终端上的撤离密码。');
            pushLog('钥匙认证通过，隐藏门已打开。');
        }

        function readTerminal(terminal) {
            if (!terminal || terminal.read) return;
            terminal.read = true;
            gameState.foundCode = true;
            gameState.score += 250;
            playSfx('key');
            setObjective('找到出口大门，输入撤离密码。');
            pushLog(`终端线索：${terminal.message || `EXIT CODE :: ${EXIT_CODE}`}`);
            updateUI();
        }

        function showPasswordPrompt() {
            if (gameState.escaped || gameState.isGameOver || gameState.isPaused) return;
            gameState.isPaused = true;
            if (document.pointerLockElement) document.exitPointerLock();
            const input = document.getElementById('password-input');
            setElementVisible('password-panel', true);
            input.value = '';
            setTimeout(() => input.focus(), 0);
        }

        function hidePasswordPrompt() {
            setElementVisible('password-panel', false);
            gameState.isPaused = false;
            updateUI();
        }

        function completeEscape() {
            gameState.escaped = true;
            gameState.isGameOver = true;
            gameState.score += 1000;
            playSfx('success');
            if (document.pointerLockElement) document.exitPointerLock();
            setElementVisible('password-panel', false);
            document.getElementById('ending-text').textContent = [
                'FACILITY LOCKDOWN BYPASSED',
                'SURVIVOR SIGNAL ACQUIRED',
                `FINAL SCORE ${String(gameState.score).padStart(6, '0')}`
            ].join('\n');
            setElementVisible('ending-panel', true);
            updateUI();
        }

        function submitPassword() {
            const input = document.getElementById('password-input');
            if (input.value.trim() === EXIT_CODE) {
                completeEscape();
            } else {
                playSfx('error');
                pushLog('密码错误。重新确认隐藏房间线索。');
                input.value = '';
                input.focus();
            }
        }

        function interact() {
            if (gameState.isGameOver || gameState.isPaused) return;
            for (const door of doors) {
                if (door.active && distanceXZ(player.position, door.mesh.position) < 1.7) {
                    if (gameState.hasKey) unlockDoor(door);
                    else {
                        playSfx('error');
                        pushLog('隐藏门锁定：需要钥匙。');
                    }
                    return;
                }
            }
            for (const terminal of terminals) {
                if (distanceXZ(player.position, terminal.group.position) < 1.8) {
                    readTerminal(terminal);
                    return;
                }
            }
            for (const exit of exits) {
                if (distanceXZ(player.position, exit.group.position) < 1.9) {
                    showPasswordPrompt();
                    return;
                }
            }
            pushLog('附近没有可交互目标。');
        }

        function updateNearbyAction() {
            gameState.nearbyAction = '';
            for (const door of doors) {
                if (door.active && distanceXZ(player.position, door.mesh.position) < 2.2) {
                    gameState.nearbyAction = gameState.hasKey
                        ? `[E] OPEN ${door.label || 'DOOR'}`
                        : `[E] LOCKED ${door.label || 'DOOR'}: KEY REQUIRED`;
                    return;
                }
            }
            for (const terminal of terminals) {
                if (!terminal.read && distanceXZ(player.position, terminal.group.position) < 2.2) {
                    gameState.nearbyAction = `[E] READ ${terminal.label || 'TERMINAL'}`;
                    return;
                }
            }
            for (const exit of exits) {
                if (distanceXZ(player.position, exit.group.position) < 2.2) {
                    gameState.nearbyAction = `[E] ENTER ${exit.label || 'EXIT'} CODE`;
                    return;
                }
            }
        }

        // ==========================================
        // 5. 隐藏式手势交互控制
        // ==========================================
        let touchLeft = null; let touchRight = null;
        let moveForward = 0; let moveRight = 0;
        let yaw = 0; let pitch = 0;
        let mouseLookFallback = null;

        function applyLookDelta(dx, dy, sensitivity = 0.002) {
            yaw -= dx * sensitivity;
            pitch -= dy * sensitivity;
            pitch = clamp(pitch, -Math.PI / 2.2, Math.PI / 2.2);
            player.rotation.y = yaw;
            pitchObject.rotation.x = pitch;
            document.body.dataset.lookState = JSON.stringify({ yaw, pitch });
        }

        function startMouseLookFallback(e) {
            mouseLookFallback = {
                lastX: e.clientX,
                lastY: e.clientY,
                active: true
            };
            document.body.dataset.mouseLookMode = 'fallback';
        }

        function stopMouseLookFallback() {
            mouseLookFallback = null;
            document.body.dataset.mouseLookMode = '';
        }

        function isPointerLocked() {
            return document.pointerLockElement === document.body;
        }

        function requestMouseLook(e) {
            if (typeof document.body.requestPointerLock !== 'function') {
                startMouseLookFallback(e);
                return;
            }

            try {
                const lockRequest = document.body.requestPointerLock();
                if (lockRequest && typeof lockRequest.catch === 'function') {
                    lockRequest.catch(() => startMouseLookFallback(e));
                }
            } catch {
                startMouseLookFallback(e);
            }
        }

        window.addEventListener('touchstart', (e) => {
            if (gameState.isGameOver) return;
            const halfWidth = window.innerWidth / 2;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < halfWidth) {
                    touchLeft = { id: t.identifier, startX: t.clientX, startY: t.clientY, curX: t.clientX, curY: t.clientY };
                } else {
                    touchRight = { id: t.identifier, startX: t.clientX, startY: t.clientY, curX: t.clientX, curY: t.clientY, isTap: true, time: Date.now() };
                }
            }
        }, { passive: false });

        window.addEventListener('touchstart', startBgm, { passive: true });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (gameState.isGameOver) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (touchLeft && t.identifier === touchLeft.id) {
                    touchLeft.curX = t.clientX; touchLeft.curY = t.clientY;
                    const maxRadius = 50;
                    moveRight = (t.clientX - touchLeft.startX) / maxRadius;
                    moveForward = -(t.clientY - touchLeft.startY) / maxRadius; 
                    moveRight = clamp(moveRight, -1, 1);
                    moveForward = clamp(moveForward, -1, 1);
                }
                if (touchRight && t.identifier === touchRight.id) {
                    yaw += (t.clientX - touchRight.curX) * -0.005;
                    pitch += (t.clientY - touchRight.curY) * -0.005;
                    pitch = clamp(pitch, -Math.PI / 2.2, Math.PI / 2.2);
                    player.rotation.y = yaw;
                    pitchObject.rotation.x = pitch;

                    if (Math.abs(t.clientX - touchRight.startX) > 10 || Math.abs(t.clientY - touchRight.startY) > 10) {
                        touchRight.isTap = false;
                    }
                    touchRight.curX = t.clientX; touchRight.curY = t.clientY;
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (touchLeft && t.identifier === touchLeft.id) { touchLeft = null; moveForward = 0; moveRight = 0; }
                if (touchRight && t.identifier === touchRight.id) {
                    if (touchRight.isTap && Date.now() - touchRight.time < 300) shoot();
                    touchRight = null;
                }
            }
        });

        // --- PC端完美键鼠支持 (Pointer Lock & WASD) ---
        // 1. 鼠标锁定与开火
        document.addEventListener('pointerdown', (e) => {
            if (gameState.isGameOver) return;
            if (gameState.isPaused) return; // 新增：暂停期间（调参期间）不允许鼠标锁定和开火
            // 排除手机端的触摸事件，防止和上述的触控逻辑冲突
            if (e.pointerType === 'touch') return; 
            
            if (isPointerLocked()) {
                if (e.button === 0) shoot(); // 锁定状态下：左键开火
                return;
            }

            if (mouseLookFallback?.active) {
                if (e.button === 0) shoot();
                return;
            }

            requestMouseLook(e);
        });

        document.addEventListener('pointerdown', startBgm);

        // 2. 鼠标自由移动控制视角
        window.addEventListener('mousemove', e => {
            if (gameState.isPaused) return; // 新增：暂停期间停止视角转动
            if (isPointerLocked()) {
                // 读取鼠标的物理相对位移 (movementX/Y)，实现真正的 FPS 视角
                applyLookDelta(e.movementX, e.movementY);
            } else if (mouseLookFallback?.active) {
                const dx = e.clientX - mouseLookFallback.lastX;
                const dy = e.clientY - mouseLookFallback.lastY;
                mouseLookFallback.lastX = e.clientX;
                mouseLookFallback.lastY = e.clientY;
                applyLookDelta(dx, dy, 0.005);
            }
        });

        document.addEventListener('pointerlockchange', () => {
            document.body.dataset.mouseLookMode = isPointerLocked()
                ? 'pointer-lock'
                : (mouseLookFallback?.active ? 'fallback' : '');
        });

        window.addEventListener('blur', () => {
            stopMouseLookFallback();
        });

        document.getElementById('password-submit').addEventListener('click', submitPassword);
        document.getElementById('password-cancel').addEventListener('click', hidePasswordPrompt);

        // 3. 更丝滑的 WASD 键盘记录（支持斜向移动）
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            const passwordVisible = isElementVisible('password-panel');
            if (passwordVisible) {
                if (k === 'enter') submitPassword();
                if (k === 'escape') hidePasswordPrompt();
                return;
            }
            
            // 新增：P键控制开发者面板与游戏暂停
            if (k === 'p') {
                gameState.isPaused = !gameState.isPaused;
                gui.domElement.style.display = gameState.isPaused ? 'block' : 'none';
                
                if (gameState.isPaused) {
                    // 呼出面板时，释放鼠标供用户点击 UI
                    if (document.pointerLockElement) document.exitPointerLock();
                } else {
                    // 关闭面板时，自动请求锁定鼠标，恢复游戏
                    // 这里不直接锁定，让用户通过下一次点击屏幕来锁定即可
                }
                updateUI();
                return;
            }
            const weaponKey = Number(k);
            if (Number.isInteger(weaponKey) && weapons[weaponKey - 1]) {
                switchWeapon(weaponKey - 1);
                return;
            }
            if (k === 'q') {
                switchWeapon((gameState.weaponIndex + 1) % weapons.length);
                return;
            }
            if (k === 'e') {
                interact();
                return;
            }

            if (keys.hasOwnProperty(k)) keys[k] = true;
        });
        window.addEventListener('keydown', startBgm);
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = false;
        });

        // ==========================================
        // 6. 核心游戏循环与物理计算
        // ==========================================
        function checkWallCollision(newPos) {
            const playerRadius = 0.3;
            for (const wall of getNearbyWallColliders(newPos, 1)) {
                if (!wall.active) continue;
                if (newPos.x + playerRadius > wall.box.min.x && newPos.x - playerRadius < wall.box.max.x &&
                    newPos.z + playerRadius > wall.box.min.z && newPos.z - playerRadius < wall.box.max.z) {
                    return true;
                }
            }
            return false;
        }

        function renderPanel(id, title, lines, tone = '') {
            if (window.ASCIIUI?.renderPanel) {
                window.ASCIIUI.renderPanel(id, { title, lines, tone });
                return;
            }

            const panel = document.getElementById(id);
            panel.dataset.title = title;
            if (tone) panel.dataset.tone = tone;
            else panel.removeAttribute('data-tone');
            panel.replaceChildren();

            const container = document.createElement('div');
            container.className = 'al-panel-lines';
            lines.forEach((line) => {
                const entry = document.createElement('div');
                entry.className = 'al-panel-line';
                entry.textContent = line && typeof line === 'object' ? String(line.text ?? '') : String(line ?? '');
                container.appendChild(entry);
            });
            panel.appendChild(container);
        }

        function bar(value, max, width = 12) {
            if (window.ASCIIUI?.formatMeter) {
                return window.ASCIIUI.formatMeter(value, max, { width });
            }
            const filled = clamp(Math.round((value / max) * width), 0, width);
            return `${'█'.repeat(filled)}${'░'.repeat(width - filled)}`;
        }

        function setElementVisible(id, visible, display = 'block') {
            if (window.ASCIIUI?.setElementVisible) {
                return window.ASCIIUI.setElementVisible(id, visible, display);
            }
            const element = document.getElementById(id);
            if (!element) return null;
            element.style.display = visible ? display : 'none';
            element.setAttribute('aria-hidden', visible ? 'false' : 'true');
            return element;
        }

        function isElementVisible(id) {
            if (window.ASCIIUI?.isElementVisible) {
                return window.ASCIIUI.isElementVisible(id);
            }
            const element = document.getElementById(id);
            return Boolean(element && element.style.display !== 'none');
        }

        function pushLog(text) {
            messageLog.unshift(`> ${text}`);
            messageLog.splice(5);
            updateUI();
        }

        function setObjective(text) {
            gameState.objective = text;
            updateUI();
        }

        function updateUI() {
            document.getElementById('health-val').innerText = gameState.health;
            document.getElementById('ammo-val').innerText = gameState.ammo;
            document.getElementById('score-val').innerText = gameState.score;

            const weapon = weapons[gameState.weaponIndex];
            renderPanel('ui-layer', 'OPS / STATUS', [
                `HP   ${bar(gameState.health, 100)} ${String(gameState.health).padStart(3, '0')}`,
                `AMMO ${String(gameState.ammo).padStart(3, '0')}    SCORE ${String(gameState.score).padStart(5, '0')}`,
                `WEAP ${weapon.name.padEnd(8, ' ')} COST ${weapon.cost}`,
                `KEY  ${gameState.hasKey ? 'YES' : 'NO '}    CODE ${gameState.foundCode ? EXIT_CODE : '----'}`,
                ...(gameState.isPaused ? ['PAUSED / 调试面板已打开'] : [])
            ]);

            renderPanel('mission-layer', 'MISSION / LINK', [
                gameState.objective,
                gameState.nearbyAction || 'WASD move | mouse look | LMB fire',
                `${weapons.map((item, index) => `${index + 1} ${item.name.toLowerCase()}`).join(' | ')} | E interact`
            ], 'cyan');

            renderPanel('log-layer', 'RADIO / LOG', messageLog.length ? messageLog : [
                '> 活下来，找到钥匙并逃离设施。'
            ], 'amber');
        }

        const clock = new THREE.Clock();

        function updateLogic() {
            if (gameState.isGameOver) return;
            const delta = Math.min(clock.getDelta(), 0.1); 

            // 相机震动逻辑
            if (cameraShake > 0) {
                camera.position.x = (Math.random() - 0.5) * cameraShake;
                camera.position.y = (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.8; // 阻尼衰减
                if (cameraShake < 0.01) {
                    cameraShake = 0;
                    camera.position.set(0, 0, 0);
                }
            }

            // 粒子与特效光逻辑
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.x += p.vx * delta;
                p.mesh.position.y += p.vy * delta;
                p.mesh.position.z += p.vz * delta;
                p.vy -= 15 * delta; // 模拟重力抛物线下坠
                p.life--;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
            for (let i = effectLights.length - 1; i >= 0; i--) {
                const el = effectLights[i];
                el.light.intensity *= 0.7; // 光源极速衰减，形成闪光感
                el.life--;
                if (el.life <= 0) {
                    scene.remove(el.light);
                    effectLights.splice(i, 1);
                }
            }

            // 融合：将手机端触摸滑杆与 PC 端 WASD 按键状态合并
            let curMoveF = moveForward + (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
            let curMoveR = moveRight + (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
            
            // 限制最大值为 1，防止键盘和手机同时输入导致移速翻倍
            curMoveF = clamp(curMoveF, -1, 1);
            curMoveR = clamp(curMoveR, -1, 1);

            if (curMoveF !== 0 || curMoveR !== 0) {
                const speed = 4.0 * delta; 
                const dir = new THREE.Vector3(curMoveR, 0, -curMoveF).normalize();
                dir.applyEuler(new THREE.Euler(0, yaw, 0)); 
                const nextPos = player.position.clone().add(dir.multiplyScalar(speed));
                
                if (!checkWallCollision(new THREE.Vector3(nextPos.x, player.position.y, player.position.z))) player.position.x = nextPos.x;
                if (!checkWallCollision(new THREE.Vector3(player.position.x, player.position.y, nextPos.z))) player.position.z = nextPos.z;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed * delta));
                b.life--;

                let hit = false;
                for (const wall of getNearbyWallColliders(b.mesh.position, 1)) {
                    if (wall.active && wall.box.containsPoint(b.mesh.position)) hit = true;
                }

                if (!hit) {
                    for (const enemy of enemies) {
                        // 修复：忽略高度差，只计算 XZ 平面的真实水平距离。0.6 稍微扩大了命中判定区。
                        const distXZ = Math.hypot(b.mesh.position.x - enemy.group.position.x, b.mesh.position.z - enemy.group.position.z);
                        if (enemy.active && distXZ < 0.6) {
                            hit = true;
                            enemy.health -= b.damage;
                            
                            // 触发敌人全身受击高亮闪烁
                            enemy.flashTimer = 5;
                            setEnemyFlash(enemy, true);
                            
                            if (enemy.health <= 0) {
                                enemy.active = false;
                                scene.remove(enemy.group);
                                gameState.score += enemy.reward || 100;
                                playSfx('enemyDown');
                                pushLog(`击败敌人：${enemy.name || '未知敌人'}。+${enemy.reward || 100} 分。`);
                                
                                // 触发击杀特效：相机震动 + 爆炸粒子与强光
                                cameraShake = 0.5; 
                                spawnExplosion(enemy.group.position); 
                            }
                            break;
                        }
                    }
                }
                if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }

            for (const enemy of enemies) {
                if (!enemy.active) continue;
                enemy.attackTimer = Math.max(0, enemy.attackTimer - delta);
                
                // 处理受击闪烁的颜色恢复
                if (enemy.flashTimer > 0) {
                    enemy.flashTimer--;
                    if (enemy.flashTimer <= 0) {
                        setEnemyFlash(enemy, false);
                    }
                }

                // 修复：忽略高度差，仅判断水平距离以触发攻击
                const distXZ = Math.hypot(enemy.group.position.x - player.position.x, enemy.group.position.z - player.position.z);
                if (distXZ < 10) {
                    enemy.group.lookAt(player.position.x, 0, player.position.z);
                    if (distXZ > 0.8) {
                        const dir = new THREE.Vector3().subVectors(player.position, enemy.group.position).normalize();
                        dir.y = 0;
                        enemy.group.position.add(dir.multiplyScalar(enemy.speed * delta));
                    } else if (enemy.attackTimer <= 0) {
                        takeDamage(enemy);
                        enemy.attackTimer = 0.75;
                    }
                }
            }

            for (const item of items) {
                if (!item.active) continue;
                item.mesh.rotation.x += 2 * delta; item.mesh.rotation.y += 3 * delta;
                if (player.position.distanceTo(item.mesh.position) < 1.0) {
                    item.active = false;
                    scene.remove(item.mesh);
                    if (item.type === 'ammo') {
                        const amount = item.amount || 15;
                        gameState.ammo += amount;
                        playSfx('pickup');
                        pushLog(`拾取弹药 +${amount}。`);
                    } else if (item.type === 'weapon') {
                        const index = weapons.findIndex((weapon) => weapon.id === item.weaponKind);
                        const amount = item.amount || item.ammo || 6;
                        gameState.ammo += amount;
                        if (index >= 0) switchWeapon(index);
                        playSfx('pickup');
                        pushLog(`取得武器 ${weapons[index]?.name || item.weaponKind || 'UNKNOWN'}，弹药 +${amount}。`);
                    } else if (item.type === 'key') {
                        gameState.hasKey = true;
                        gameState.score += 150;
                        playSfx('key');
                        setObjective('返回隐藏门，使用钥匙进入控制室。');
                        pushLog('取得钥匙。隐藏门认证已可用。');
                    } else {
                        const amount = item.amount || 30;
                        gameState.health = clamp(gameState.health + amount, 0, 100);
                        playSfx('pickup');
                        pushLog(`医疗包恢复 +${amount}。`);
                    }
                    updateUI();
                }
            }

            const previousAction = gameState.nearbyAction;
            updateNearbyAction();
            if (previousAction !== gameState.nearbyAction) updateUI();
        }

        // ==========================================
        // 7. WebGL 后处理 ASCII 渲染引擎
        // ==========================================
        
        function resizeRenderer() {
            // 等宽字体 Courier 的高宽比大概是 1 : 0.6
            CHAR_HEIGHT = PIXEL_SIZE;
            CHAR_WIDTH = PIXEL_SIZE * 0.6; 

            // 计算屏幕能容纳的字符阵列维度
            cols = Math.floor(window.innerWidth / CHAR_WIDTH);
            rows = Math.floor(window.innerHeight / CHAR_HEIGHT);
            
            // WebGL 后处理：低分辨率场景纹理 + 全屏 shader 输出
            renderTarget.setSize(cols, rows);
            renderer.setSize(window.innerWidth, window.innerHeight, false);
            postMaterial.uniforms.gridSize.value.set(cols, rows);
            
            // 核心修复：摄像机长宽比直接使用真实屏幕长宽比，抵消字符自身的非正方形拉伸！
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeRenderer);
        resizeRenderer(); 

        function renderAscii() {
            // 1. 渲染 3D 场景到低分辨率纹理
            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);

            // 2. 在 GPU fragment shader 中完成亮度到字符图集的映射
            renderer.setRenderTarget(null);
            renderer.render(postScene, postCamera);
        }

        // ==========================================
        // 8. 启动
        // ==========================================
        buildLevel();
        if (runtimeLevel.source === 'editor-local') {
            pushLog(`载入地编关卡：${runtimeLevel.levelName || runtimeLevel.levelId} / floor ${runtimeLevel.floor}`);
        } else {
            updateUI();
        }
        if (new URLSearchParams(window.location.search).get('debugModal') === 'password') {
            setElementVisible('password-panel', true);
        }
        function getUiClassState(id, classNames) {
            return window.ASCIIUI?.getElementState?.(id, classNames) || { exists: false };
        }

        function getDebugSnapshot() {
            return {
                sharedContract: SHARED_DATA.getContractState?.({
                    clamp: 'clamp',
                    contractState: 'getContractState'
                }) || {},
                sharedUiContract: window.ASCIIUI?.getContractState?.([
                    'formatMeter',
                    'colorVarStyle',
                    'swatchHtml',
                    'downloadTextFile',
                    'renderPanel',
                    'setPanelLines',
                    'setElementVisible',
                    'isElementVisible',
                    'getElementState',
                    'getPanelState',
                    'getContractState'
                ]) || {},
                hudPanels: {
                    status: window.ASCIIUI?.getPanelState?.('ui-layer') || { exists: false },
                    mission: window.ASCIIUI?.getPanelState?.('mission-layer') || { exists: false },
                    log: window.ASCIIUI?.getPanelState?.('log-layer') || { exists: false }
                },
                screenUi: {
                    asciiCanvas: getUiClassState('ascii-canvas', ['al-fullscreen-canvas']),
                    crosshair: getUiClassState('crosshair', ['al-crosshair']),
                    damageFlash: getUiClassState('damage-flash', ['al-damage-flash'])
                },
                modalUi: {
                    passwordPanel: getUiClassState('password-panel', ['terminal-modal', 'al-modal', 'al-modal-centered']),
                    endingPanel: getUiClassState('ending-panel', ['terminal-modal', 'al-modal', 'al-modal-centered']),
                    gameOverPanel: getUiClassState('game-over', ['terminal-modal', 'al-modal', 'al-modal-centered']),
                    passwordTitle: getUiClassState('password-title', ['al-modal-title']),
                    passwordCopy: getUiClassState('password-copy', ['al-modal-copy']),
                    endingTitle: getUiClassState('ending-title', ['al-modal-title']),
                    endingText: getUiClassState('ending-text', ['al-modal-copy']),
                    gameOverTitle: getUiClassState('game-over-title', ['al-modal-title']),
                    passwordInput: getUiClassState('password-input', ['al-input', 'al-input-code']),
                    passwordSubmit: getUiClassState('password-submit', ['al-button', 'al-button-terminal']),
                    passwordCancel: getUiClassState('password-cancel', ['al-button', 'al-button-terminal']),
                    endingRestart: getUiClassState('ending-restart', ['al-button', 'al-button-terminal']),
                    gameOverRestart: getUiClassState('game-over-restart', ['al-button', 'al-button-terminal'])
                },
                modalText: {
                    passwordTitle: document.getElementById('password-title')?.textContent || '',
                    passwordCopy: document.getElementById('password-copy')?.textContent || '',
                    endingTitle: document.getElementById('ending-title')?.textContent || '',
                    endingText: document.getElementById('ending-text')?.textContent || '',
                    gameOverTitle: document.getElementById('game-over-title')?.textContent || ''
                },
                runtimeLevel: {
                    source: runtimeLevel.source,
                    levelId: runtimeLevel.levelId,
                    levelName: runtimeLevel.levelName,
                    floor: runtimeLevel.floor,
                    startCell: runtimeLevel.startCell,
                    triggerCount: runtimeLevel.triggers?.length || 0
                },
                runtimeModels: {
                    source: modelProfileBundle?.source || 'built-in',
                    modelEditorEnemyCount: modelEditorEnemyProfiles.length,
                    activeEnemyCount: activeEnemyProfiles.length,
                    itemModelCount: modelProfileBundle?.itemModels?.length || 0
                },
                levelSize: { rows: levelMap.length, cols: levelMap[0].length },
                tileCounts: countTiles(levelMap),
                wallCount: walls.length,
                wallGridBuckets: wallGrid.size,
                enemyCount: enemies.length,
                enemyKinds: countBy(enemies, (enemy) => enemy.kind || 'unknown'),
                itemTypes: countBy(items, 'type'),
                doorCount: doors.length,
                terminalCount: terminals.length,
                exitCount: exits.length,
                weapons: weapons.map((weapon) => ({ name: weapon.name, cost: weapon.cost, pellets: weapon.pellets })),
                messageLog: [...messageLog],
                shaderPipeline: !!postMaterial && !!renderTarget
            };
        }
        window.__ASCII_LABYRINTH_DEBUG__ = getDebugSnapshot;
        document.body.dataset.debugSnapshot = JSON.stringify(getDebugSnapshot());

        function animate() {
            requestAnimationFrame(animate);
            // 修改：暂停状态下跳过物理和逻辑更新，仅保留渲染引擎继续运行（所见即所得调参）
            if (!gameState.isPaused) {
                updateLogic();
            }
            renderAscii(); 
        }
        animate();

    </script>
</body>
